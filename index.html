  --serif:"Fraunces","Iowan Old Style","Georgia",serif;--sans:"Source Sans 3","Source Sans Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--tabh:62px;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#1A1410;--card:#261D17;--ink:#F4EADF;--ink2:#CDB9A7;--ink3:#A8937F;--heat-ink:#EE9466;--olive-ink:#AEBB86;--terra:#D86C40;--terra2:#E58A5E;--terra-soft:#3A2418;
  --wheat:#30251D;--wheat2:#3D2F25;--olive:#9DAA74;--olive-soft:#273021;--heat:#3A2419;--heat2:#E8834D;--cold:#8FA8B8;--cold-soft:#1F2A30;
  --line:rgba(255,236,215,.08);--line2:rgba(255,236,215,.14);--nav:rgba(26,20,16,.8);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--shadow-lg:0 2px 6px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#1A1410;--card:#261D17;--ink:#F4EADF;--ink2:#CDB9A7;--ink3:#A8937F;--heat-ink:#EE9466;--olive-ink:#AEBB86;--terra:#D86C40;--terra2:#E58A5E;--terra-soft:#3A2418;
  --wheat:#30251D;--wheat2:#3D2F25;--olive:#9DAA74;--olive-soft:#273021;--heat:#3A2419;--heat2:#E8834D;--cold:#8FA8B8;--cold-soft:#1F2A30;
  --line:rgba(255,236,215,.08);--line2:rgba(255,236,215,.14);--nav:rgba(26,20,16,.8);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--shadow-lg:0 2px 6px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums lining-nums}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.view{position:absolute;inset:0;bottom:calc(var(--tabh) + var(--sab));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scroll-behavior:auto}
.view.enter{animation:fadeUp .32s var(--ease)}
.view.push{animation:pushIn .38s var(--ease)}
.view.pop{animation:popIn .32s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pushIn{from{transform:translateX(34%);opacity:.3}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:translateX(-18%);opacity:.4}to{transform:none;opacity:1}}
.wrap{padding:0 18px 28px;max-width:640px;margin:0 auto}
/* nav */
.nav{position:sticky;top:0;z-index:20;height:calc(48px + var(--sat));padding-top:var(--sat);display:flex;align-items:center;justify-content:center;transition:background .2s,box-shadow .2s}
.nav .t{font-family:var(--sans);font-weight:700;font-size:16px;opacity:0;transform:translateY(4px);transition:all .22s var(--ease)}
.nav.solid{background:var(--nav);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);box-shadow:0 .5px 0 var(--line2)}
.nav.solid .t{opacity:1;transform:none}
.nav .left,.nav .right{position:absolute;top:var(--sat);height:48px;display:flex;align-items:center}
.nav .left{left:6px}.nav .right{right:10px}
.back{display:flex;align-items:center;gap:2px;color:var(--terra);font-weight:600;font-size:17px;padding:8px 10px;border-radius:12px}
.back svg{width:22px;height:22px}
.iconbtn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--terra)}
.iconbtn svg{width:22px;height:22px}
.large{padding:2px 18px 10px;max-width:640px;margin:0 auto}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--terra)}
h1.lt{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.08;margin:4px 0 0;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:15px;margin-top:6px}
h2.sh{font-family:var(--serif);font-weight:600;font-size:21px;margin:26px 0 10px;letter-spacing:-.005em}
h2.sh small{font-family:var(--sans);font-weight:500;font-size:13px;color:var(--ink3);margin-left:6px}
h3{font-family:var(--serif);font-weight:600;font-size:17px;margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--ink2)}.faint{color:var(--ink3);font-size:13px}
/* cards */
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card.tint{background:var(--wheat);box-shadow:none}
.card.heat{background:var(--heat);box-shadow:none;border-left:4px solid var(--heat2)}
.card.olive{background:var(--olive-soft);box-shadow:none;border-left:4px solid var(--olive)}
.card .ct{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink3);margin-bottom:8px}
.card.heat .ct{color:var(--heat2)}.card.olive .ct{color:var(--olive)}
.pressable{transition:transform .18s var(--ease),box-shadow .18s}
.pressable:active{transform:scale(.975)}
/* recipe cards */
.rcard{display:block;width:100%;text-align:left;background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.rcard .art{height:168px;position:relative;overflow:hidden}
.rcard .art svg{position:absolute;inset:0;width:100%;height:100%}
.rcard .body{padding:14px 16px 16px}
.rcard .name{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.15}
.rcard .desc{color:var(--ink2);font-size:14.5px;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--wheat);color:var(--ink2);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
.chip.t{background:var(--terra-soft);color:var(--terra2)}
.chip.o{background:var(--olive-soft);color:var(--olive)}
.chip.c{background:var(--cold-soft);color:var(--cold)}
.chip.h{background:var(--heat);color:var(--heat2)}
/* hero */
.hero{position:relative;height:250px;margin-top:calc(-48px - var(--sat));overflow:hidden}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .scrim{position:absolute;inset:auto 0 0 0;height:60%;background:linear-gradient(to top,rgba(30,18,10,.55),transparent)}
.hero .ht{position:absolute;left:18px;right:18px;bottom:16px;color:#FFF6EA}
.hero .ht h1{font-family:var(--serif);font-weight:600;font-size:32px;margin:0;line-height:1.05;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.hero .ht .kicker{color:#F7C9A6}
.nav.over:not(.solid) .back,.nav.over:not(.solid) .iconbtn{color:#fff;background:rgba(30,18,10,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.nav.over:not(.solid) .back{padding:8px 12px 8px 6px}
/* segmented */
.seg{display:flex;background:var(--wheat);border-radius:12px;padding:3px;gap:2px;position:relative}
.seg button{flex:1;min-height:44px;border-radius:9px;font-weight:600;font-size:14.5px;color:var(--ink2);transition:all .2s var(--ease);white-space:nowrap;padding:0 8px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(59,42,32,.14),0 1px 1px rgba(59,42,32,.06)}
.seg.sticky{position:sticky;top:calc(48px + var(--sat));z-index:15;margin:0 -18px;padding:8px 18px;border-radius:0;background:var(--nav);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.seg.sticky .inner{display:flex;background:var(--wheat);border-radius:12px;padding:3px;gap:2px;width:100%}
/* stepper */
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ctrl:last-child{border-bottom:0;padding-bottom:2px}
.ctrl:first-child{padding-top:2px}
.ctrl .lab{font-weight:600}
.ctrl .lab small{display:block;font-weight:400;color:var(--ink3);font-size:13px}
.stepper{display:flex;align-items:center;background:var(--wheat);border-radius:14px;padding:3px;flex-shrink:0}
.stepper button{width:46px;height:44px;border-radius:11px;display:grid;place-items:center;color:var(--terra);font-size:22px;font-weight:600;transition:background .15s}
.stepper button:active{background:var(--wheat2)}
.stepper button:disabled{color:var(--ink3);opacity:.5}
.stepper .val{min-width:76px;text-align:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.stepper .val small{font-weight:500;color:var(--ink3);font-size:13px;margin-left:2px}
.pillrow{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 6px;margin:0 -18px;scrollbar-width:none;scroll-snap-type:x proximity}
.pillrow::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;scroll-snap-align:start;border-radius:16px;padding:10px 14px;background:var(--card);box-shadow:var(--shadow);font-weight:600;font-size:14px;text-align:left;border:2px solid transparent;transition:all .18s var(--ease)}
.pill small{display:block;font-weight:500;color:var(--ink3);font-size:12px}
.pill.on{border-color:var(--terra);background:var(--terra-soft);color:var(--terra2)}
.pill.on small{color:var(--terra2);opacity:.8}
.rpick{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:4px 18px 10px;scrollbar-width:none}
.rpick::-webkit-scrollbar{display:none}
.rpick button{flex-shrink:0;width:92px;text-align:center;font-weight:600;font-size:13px;color:var(--ink2)}
.rpick .th{width:92px;height:72px;border-radius:18px;overflow:hidden;position:relative;margin-bottom:6px;box-shadow:var(--shadow);border:3px solid transparent;transition:all .2s var(--ease)}
.rpick .th svg{position:absolute;inset:0;width:100%;height:100%}
.rpick button.on{color:var(--terra2)}
.rpick button.on .th{border-color:var(--terra);transform:translateY(-2px)}
/* slider */
.slider{padding:6px 0 2px}
.slider .top{display:flex;justify-content:space-between;align-items:baseline}
.slider .big{font-family:var(--serif);font-weight:600;font-size:30px;color:var(--terra2)}
.slider .big small{font-size:16px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:6px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--terra) 0,var(--terra) var(--p,50%),var(--wheat2) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;margin-top:-11px;box-shadow:0 1px 3px rgba(0,0,0,.25),0 4px 10px rgba(59,42,32,.18);border:.5px solid rgba(0,0,0,.06)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--wheat2)}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--terra)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3)}
.mark{font-size:12.5px;color:var(--ink3)}
/* ingredients */
.ing{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:0}
.ing .n{flex:1;min-width:0}
.ing .n small{display:block;color:var(--ink3);font-size:13px}
.ing .g{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ing .g small{font-weight:500;color:var(--ink3);font-size:13px;margin-left:1px}
.ing .p{width:58px;text-align:right;color:var(--ink3);font-size:13.5px;font-variant-numeric:tabular-nums}
.ing.total{border-top:2px solid var(--terra);border-bottom:0;margin-top:2px}
.ing.total .n{font-weight:700}
.ing.total .g{color:var(--terra2);font-size:20px}
.grp{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--terra);margin:14px 0 0}
.grp:first-child{margin-top:0}
.flash{animation:flash .5s var(--ease)}
@keyframes flash{0%{color:var(--terra)}100%{}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--wheat);border-radius:16px;padding:10px 12px}
.stat b{display:block;font-family:var(--serif);font-weight:600;font-size:22px;color:var(--terra2);font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{font-size:12.5px;color:var(--ink2)}
/* build */
.build{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.build .b{flex:1;min-width:70px;background:var(--card);border-radius:14px;padding:8px 6px;text-align:center}
.build .b b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.build .b span{font-size:12px;color:var(--ink3)}
.build .plus{color:var(--ink3);font-weight:700}
/* method */
.steps{position:relative}
.step{display:flex;gap:14px;padding-bottom:18px;position:relative}
.step:not(:last-child)::before{content:"";position:absolute;left:15px;top:34px;bottom:2px;width:2px;background:var(--wheat2);border-radius:1px}
.step .dot{flex-shrink:0;width:32px;height:32px;border-radius:16px;background:var(--terra-soft);color:var(--terra2);display:grid;place-items:center;font-weight:700;font-size:14px}
.step .tx b{display:block;font-size:16px;margin:4px 0 2px}
.step .tx span{color:var(--ink2);font-size:14.5px}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;padding:0 8px 8px 0;border-bottom:2px solid var(--terra)}
.tbl td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-right:0}
.tbl tr.hl td{color:var(--terra2);font-weight:700}
/* accordion */
.acc{background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.acc>button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:15px 16px;font-weight:700;min-height:54px}
.acc>button .ch{margin-left:auto;transition:transform .25s var(--ease);color:var(--ink3)}
.acc.open>button .ch{transform:rotate(90deg)}
.acc .ab{display:none;padding:0 16px 16px}
.acc.open .ab{display:block;animation:fadeUp .25s var(--ease)}
.trow{padding:10px 0;border-top:1px solid var(--line)}
.trow b{display:block}
.trow .cause{color:var(--ink3);font-size:13.5px}
.trow .fix{color:var(--ink2);font-size:14.5px;margin-top:2px}
.trow .fix::before{content:"Fix: ";font-weight:700;color:var(--olive)}
ul.clean{margin:0;padding:0;list-style:none}
ul.clean li{position:relative;padding:6px 0 6px 22px}
ul.clean li::before{content:"";position:absolute;left:4px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--terra)}
ul.clean.ok li::before{background:var(--olive)}
ul.clean.bad li::before{background:#B23A2E}
ol.rules{margin:0;padding:0;list-style:none;counter-reset:r}
ol.rules li{counter-increment:r;display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
ol.rules li:last-child{border-bottom:0}
ol.rules li::before{content:counter(r);flex-shrink:0;width:26px;height:26px;border-radius:13px;background:var(--terra);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:16px;font-weight:700;font-size:17px;background:var(--terra);color:#fff;box-shadow:0 6px 18px rgba(181,86,47,.32);transition:transform .15s var(--ease),filter .15s}
.btn:active{transform:scale(.97);filter:brightness(.95)}
.btn.sec{background:var(--wheat);color:var(--terra2);box-shadow:none}
.btn.ghost{background:transparent;color:var(--terra);box-shadow:none;border:1.5px solid var(--line2)}
.btn svg{width:20px;height:20px}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabh) + var(--sab));padding-bottom:var(--sab);display:flex;background:var(--nav);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);box-shadow:0 -.5px 0 var(--line2);z-index:40}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink3);position:relative;transition:color .2s}
.tabbar button svg{width:26px;height:26px;transition:transform .25s var(--ease)}
.tabbar button.on{color:var(--terra)}
.tabbar button.on svg{transform:translateY(-1px) scale(1.06)}
.tabbar .badge{position:absolute;top:7px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--heat2);box-shadow:0 0 0 2px var(--bg);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
/* now baking pill */
.nowpill{position:fixed;left:12px;right:12px;bottom:calc(var(--tabh) + var(--sab) + 10px);z-index:35;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:20px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow-lg);animation:fadeUp .35s var(--ease);max-width:616px;margin:0 auto}
.nowpill .mini{width:40px;height:40px;flex-shrink:0}
.nowpill .tt{flex:1;min-width:0}
.nowpill .tt b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowpill .tt span{font-size:12.5px;opacity:.7}
.nowpill .cd{font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.has-pill .wrap{padding-bottom:96px}
/* planner timeline */
.daytag{position:sticky;top:calc(48px + var(--sat));z-index:5;display:flex;align-items:center;gap:8px;padding:10px 0 8px;background:var(--bg);font-weight:700;font-size:14px}
.daytag .dd{background:var(--ink);color:var(--bg);padding:3px 10px;border-radius:999px;font-size:12.5px;letter-spacing:.04em}
.daytag .rel{color:var(--ink3);font-weight:600;font-size:13px}
.tl{position:relative}
.ev{display:grid;grid-template-columns:54px 22px 1fr;gap:0 8px;position:relative;min-height:56px}
.ev .tm{font-weight:700;font-variant-numeric:tabular-nums;font-size:16px;padding-top:12px;text-align:right}
.ev .rail{position:relative;display:flex;justify-content:center}
.ev .rail::before{content:"";position:absolute;top:0;bottom:0;width:3px;border-radius:2px;background:var(--seg,var(--wheat2))}
.ev .rail i{position:relative;z-index:1;margin-top:13px;width:16px;height:16px;border-radius:50%;background:var(--card);border:3.5px solid var(--seg,var(--terra))}
.ev .bx{padding:8px 0 10px}
.ev .bx .in{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px}
.ev .bx b{display:block;font-size:15.5px;line-height:1.25}
.ev .bx .d{font-size:13.5px;color:var(--ink2);margin-top:2px}
.ev .bx .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.ev .bar{height:6px;border-radius:3px;background:var(--seg);opacity:.85;min-width:6px}
.ev.anchor .bx .in{background:var(--terra);color:#fff;box-shadow:0 8px 22px rgba(181,86,47,.35)}
.ev.anchor .bx .d{color:rgba(255,255,255,.85)}
.ev.anchor .chip{background:rgba(255,255,255,.2);color:#fff}
.k-prep{--seg:var(--terra)}.k-wait{--seg:#C9A77E}.k-cold{--seg:var(--cold)}.k-oven{--seg:var(--heat2)}.k-rest{--seg:var(--olive)}
.overview{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin:10px 0 6px}

/* ---------- guidance ---------- */
function guideFor(rid){
  const t=S.temp,b=band(t),wt=75-2*t;
  const water=wt<5?"Ice-cold + chilled flour":`≈ ${Math.round(wt)} °C`;
  const g=[["Mother after feeding",t>=27?"30–60 min out, then fridge":"1–2 h out, then fridge",0]];
  if(rid==="loaf")g.push(["Levain to peak",fmtWin(interp(LEV,t)),1],["Mixing water",water,0],["Shape at rise",LOAF_RISE[b],0],["Bulk from levain in",fmtWin(interp(LOAF_BULK,t)),1]);
  else if(rid==="focaccia")g.push(["Levain to peak",fmtWin(interp(LEV_FAST,t)),1],["Mixing water",water,0],["Bulk target rise",FOC_RISE[b],0],["Bulk from levain in",fmtWin(interp(LOAF_BULK,t)),1],["Day-2 warm-up",fmtWin(interp(FOC_WARM,t)),1]);
  else if(rid==="pizza")g.push(["Levain to peak",fmtWin(interp(LEV_FAST,t)),1],["Mixing water",water,0],["Bulk target rise",PIZ_RISE[b],0],["Bulk from levain in",fmtWin(interp(PIZ_BULK,t)),1],["Warm-up before baking",fmtWin(interp(PIZ_WARM,t)),1]);
  else{const V=SANDWICH_VARIANTS[S.variant.sandwich];g.push(["Stiff starter",`${V.label}: ${V.sub}`,0],["Mixing water","Fridge-cold",0],["Bulk to 40–50%",fmtWin(interp(SW_BULK,t)),1],["Final proof from fridge",fmtWin(interp(SW_PROOF,t)),1])}
  return g;
}
function tempNote(){const t=S.temp;return t<18||t>32?`<div class="notebar" style="margin:10px 0 0"><span>ℹ︎</span><span>${t<18?"Below 18 °C":"Above 32 °C"} the timing tables are stretched beyond what they cover (estimates are held at the ${t<18?"23":"29"} °C values). Go by the dough cues${t>32?"; use chilled water and the fridge to slow things down":"; a warmer spot (oven with the light on) helps"}.</span></div>`:""}
function thermoColor(t){return t<=23?"#56707F":t<=25?"#5C6A38":t<=26?"#8A6A1E":t<=28?"#A9522A":"#B23A2E"} // v2.1: all ≥4.5:1 against the white label

/* ---------- timer ----------
   The session is a snapshot: steps, kitchen temp, fridge option and variant are copied at start,
   so changing settings mid-bake never changes a running timer. A step that ends never starts the
   next one by itself: rising/proof steps end in a readiness check, the others in a "Start next" tap. */
function remNow(){const s=S.session;if(!s)return 0;return s.running?Math.max(0,(s.endsAt-Date.now())/1000):s.remaining}
function startSession(rid,from){const p=currentPlan(rid);
  S.session={rid,steps:p.steps.map(x=>({t:x.t,d:x.d,k:x.k,detail:x.detail,cue:x.cue||"",est:!!x.est,check:!!x.check,key:x.key||"",hands:x.hands||0})),anchor:p.anchor,idx:from||0,running:false,
    remaining:p.steps[from||0].d*60,endsAt:0,startedAt:Date.now(),alerted:false,temp:S.temp,cold:S.cold[rid],variant:S.variant.sandwich,chillH:chillH(),doughT:null,summary:calc(rid).summary};
  sessDirty=true;unlockAudio();tPlay()}
function tPlay(){const s=S.session;if(!s)return;if(s.remaining<=0)s.remaining=s.steps[s.idx].d*60;s.endsAt=Date.now()+s.remaining*1000;s.running=true;s.alerted=false;sessDirty=true;saveNow();wakeSync()}
function tPause(){const s=S.session;if(!s)return;s.remaining=remNow();s.running=false;sessDirty=true;saveNow();wakeSync()}
function tGo(i,autoplay){const s=S.session;if(!s)return;s.idx=clamp(i,0,s.steps.length-1);s.remaining=s.steps[s.idx].d*60;s.running=false;s.alerted=false;s.closedEnd=false;sessDirty=true;if(autoplay)tPlay();else saveNow()}
function tAdd(min){const s=S.session;if(!s)return;if(s.running)s.endsAt+=min*60000;else s.remaining=Math.max(0,s.remaining+min*60);if(remNow()>0)s.alerted=false;sessDirty=true;saveNow()}
/* readiness check "not yet": run this same step on for m more minutes */
function tMore(m){const s=S.session;if(!s)return;s.remaining=m*60;s.closedEnd=false;sessDirty=true;tPlay();toast(`${m} more minutes, then check again`)}
/* measured dough temperature drives the bulk estimate (never shortens below what has already passed) */
function setDoughT(v){const s=S.session;if(!s)return;const bi=s.steps.findIndex(x=>x.key==="bulk");if(bi<0)return;
  if(s.idx>bi){toast("Bulk is already finished");return}
  const T=v===null?null:clamp(v,15,35);const p=buildPlan(s.rid,s.temp,s.cold,calc(s.rid),{variant:s.variant,chillH:s.chillH,bulkT:T===null?s.temp:T});
  const nd=p.steps.find(x=>x.key==="bulk").d,delta=nd-s.steps[bi].d;s.steps[bi].d=nd;s.steps[bi].detail=p.steps.find(x=>x.key==="bulk").detail;
  if(s.idx===bi&&!(s.alerted&&remNow()<=0)){if(s.running)s.endsAt+=delta*60000;else s.remaining=Math.max(60,s.remaining+delta*60)}
  s.doughT=T;sessDirty=true;saveNow();render();toast(T===null?"Back to the kitchen-temperature estimate":`Bulk estimate now uses ${T} °C dough: ${fmtDur(nd)}`)}
let AC=null;function unlockAudio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}AC&&AC.state==="suspended"&&AC.resume()}catch(e){}}
function chime(){if(!S.sound||!AC)return;try{const t0=AC.currentTime;[0,.32,.64].forEach((o,i)=>{const os=AC.createOscillator(),g=AC.createGain();os.type="sine";os.frequency.value=[784,988,1175][i];g.gain.setValueAtTime(0,t0+o);g.gain.linearRampToValueAtTime(.28,t0+o+.02);g.gain.exponentialRampToValueAtTime(.001,t0+o+.6);os.connect(g).connect(AC.destination);os.start(t0+o);os.stop(t0+o+.65)})}catch(e){}}
function stepDone(){const s=S.session,late=Date.now()-s.endsAt;
  // another tab may already have rung for this step
  const o=readStored();if(o&&o.session&&o.session.startedAt===s.startedAt&&o.session.idx===s.idx&&o.session.alerted){s.running=false;s.remaining=0;s.alerted=true;wakeSync();return}
  s.running=false;s.remaining=0;s.alerted=true;sessDirty=true;saveNow();haptic([300,120,300,120,500]);chime();
  const st=s.steps[s.idx],at=new Date(s.endsAt);
  toast(st.check?`Time to check: ${st.t}`:late>60000?`Step ${s.idx+1} finished at ${clockOf(at)}: ${st.t}`:`Step done: ${st.t}`);wakeSync();
  notify(st.check?`Check the dough: ${st.t}`:`Step ${s.idx+1} done: ${st.t}`,st.check?"Open the app for the readiness check.":s.idx<s.steps.length-1?`Next: ${s.steps[s.idx+1].t}`:"That was the last step.")}
const CAN_VIBRATE="vibrate"in navigator,CAN_WAKE="wakeLock"in navigator,CAN_NOTIFY="Notification"in window&&"serviceWorker"in navigator&&location.protocol.startsWith("http");
function notify(title,body){if(!S.notify||!CAN_NOTIFY||Notification.permission!=="granted"||!document.hidden)return;
  try{navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,tag:"bake-step",renotify:true,icon:"icons/icon-192.png",badge:"icons/icon-192.png",vibrate:[300,120,300]})).catch(()=>{})}catch(e){}}
/* screen wake lock: requested whenever a timer runs and the page is visible (boot, restore, tab return),
   re-requested after the browser releases it, and the button shows what is actually held */
let wakeLock=null,wakeErr="",wakeBusy=false,wakeRetry=0;
async function wakeSync(){if(!CAN_WAKE)return;const want=S.wake&&S.session&&S.session.running&&!document.hidden;
  if(wakeBusy)return;wakeBusy=true;
  try{if(want&&!wakeLock){const l=await navigator.wakeLock.request("screen");wakeLock=l;wakeErr="";
      l.addEventListener("release",()=>{if(wakeLock===l)wakeLock=null;wakeUI();if(!document.hidden&&wakeRetry<3){wakeRetry++;setTimeout(wakeSync,800)}});wakeUI();wakeRetry=0}
    else if(!want&&wakeLock){const l=wakeLock;wakeLock=null;await l.release();wakeUI()}}
  catch(e){wakeLock=null;wakeErr=(e&&e.name)||"Error";wakeUI()}
  finally{wakeBusy=false}}
function wakeBtn(){if(!CAN_WAKE)return"";const s=S.session,held=!!wakeLock;
  const [lbl,cls]=held?["Screen kept on","on"]:!S.wake?["Screen may sleep",""]:s&&s.running&&!document.hidden?["Screen lock not held · tap to retry","warn"]:["Keeps screen on while running",""];
  return`<button id="wakebtn" class="chipbtn ${cls}" data-act="twake" aria-pressed="${S.wake}" data-held="${held}">${held?"☀︎":"☾"} ${lbl}</button>`}
function wakeUI(){const b=$("#wakebtn");if(b)b.outerHTML=wakeBtn()}
setInterval(()=>{const s=S.session;if(!s)return;if(s.running&&remNow()<=0&&!s.alerted)stepDone();updateTimerDom()},250);
document.addEventListener("visibilitychange",()=>{wakeRetry=0;wakeSync();updateTimerDom()});

  tin(a){S.scale.sandwich.tin=a;render()},
  tinn(d){S.scale.sandwich.n=clamp(S.scale.sandwich.n+ +d,1,6);render()},
  hreset(){const r=S.detail;S.hyd[r]=LEAN[r].H0;render()},
  planthis(a){haptic();S.rid=a;S.tab="plan";S.detail=null;ensurePlan(a,true);render("enter")},
  startthis(a){haptic();S.rid=a;if(S.session){sheet(`<h3>Replace the current bake?</h3><p class="muted">${RECIPES[S.session.rid].name} is on step ${S.session.idx+1}. Starting ${RECIPES[a].name} ends it.</p><div class="btnrow"><button class="btn sec" data-act="sheetclose">Keep it</button><button class="btn" data-act="replace" data-arg="${a}">Start new</button></div>`);return}S.tab="timer";S.detail=null;render("enter")},
  replace(a){closeSheet();S.session=null;sessDirty=true;S.rid=a;S.tab="timer";render("enter")},
  sheetclose(){closeSheet()},
  prid(a){S.rid=a;ensurePlan(a,true);render()},trid(a){S.rid=a;render()},
  pmode(a){if(S.plan.mode===a)return;const tl=timeline(S.rid);S.plan.mode=a;
    // keep the same bake when switching: carry the start (or ready) time across
    if(a==="start"){S.plan.day[S.rid]=isoDate(tl.startD);S.plan.start=clockOf(tl.startD)}else{S.plan.day[S.rid]=isoDate(tl.targetD);S.plan.anchor[S.rid]=clockOf(tl.targetD)}
    S.plan.custom[S.rid]=true;render()},
  pdate(a){S.plan.day[S.rid]=a;S.plan.custom[S.rid]=true;haptic(5);render()},
  ptime(d){const k=S.plan.mode==="finish";const cur=parseClock(k?S.plan.anchor[S.rid]:S.plan.start)??540;const nv=fmtClock(cur+ +d);if(k)S.plan.anchor[S.rid]=nv;else S.plan.start=nv;S.plan.custom[S.rid]=true;haptic(5);render()},
  pcold(a){S.cold[S.rid]=+a;render()},
  pmin(d){S.pizzaMin=clamp(S.pizzaMin+ +d,PIZZA_MIN.min,PIZZA_MIN.max);haptic(5);render()},
  ptarget(a){const r=S.rid;if(S.plan.target[r]===a)return;S.plan.target[r]=a;render()},
  pawayon(a){S.plan.away.on=a==="1";render()},
  palt(a){const [d,t,c]=a.split("|"),r=S.rid;S.plan.day[r]=d;if(S.plan.mode==="finish")S.plan.anchor[r]=t;else S.plan.start=t;if(c)S.cold[r]=+c;S.plan.custom[r]=true;haptic(8);render();toast(c?`Plan moved to the ${c} h fridge option`:"Plan moved")},
  paccept(){const r=S.rid;S.plan.custom[r]=true;S.plan.accept[r]=planSig(r);render()},
  punaccept(){delete S.plan.accept[S.rid];render()},
  variant(a){S.variant.sandwich=a;haptic(5);render()},
  chillh(d){S.variant.chillH=clamp(chillH()+ +d,CHILL_H.min,CHILL_H.max);haptic(5);render()},
  tstart(a){startSession(S.rid,+a);render();const v=$("#view");v&&v.scrollTo(0,0)},
  tplay(){unlockAudio();haptic(12);if(S.session.running)tPause();else tPlay();render()},
  tnext(){unlockAudio();haptic(12);const s=S.session;if(s.idx<s.steps.length-1)tGo(s.idx+1,true);render();const v=$("#view");v&&v.scrollTo(0,0)},
  tmore(m){unlockAudio();tMore(+m);render()},
  tchk(){const r=$(".ready");if(r){r.scrollIntoView({block:"center"});const b=r.querySelector("button");b&&b.focus({preventScroll:true})}},
  tguide(){const s=S.session;sheet(guideSheet(s,s.steps[s.idx]))},
  dtclear(){setDoughT(null)},
  tprev(){haptic();tGo(S.session.idx-1,false);render()},
  tgo(a){haptic();tGo(+a,false);render()},
  treset(){tGo(S.session.idx,false);render()},
  tadd(d){tAdd(+d);render()},
  tsound(){S.sound=!S.sound;if(S.sound){unlockAudio();chime()}render()},
  twake(){if(S.wake&&!wakeLock&&S.session&&S.session.running&&!document.hidden){wakeRetry=0;wakeSync().then(()=>{if(!wakeLock)toast(`The browser refused the screen lock${wakeErr?` (${wakeErr})`:""}. Set Auto-Lock to a long time instead.`)});return}
    S.wake=!S.wake;wakeSync();wakeUI();render()},
  tnotify(){if(!CAN_NOTIFY)return;if(S.notify&&Notification.permission==="granted"){S.notify=false;render();return}
    Notification.requestPermission().then(p=>{S.notify=p==="granted";if(p==="denied")toast("Notifications are blocked for this site in your browser settings.");render()}).catch(()=>{})},
  tend(){sheet(`<h3>End this bake?</h3><p class="muted">The timer and step progress will be cleared.</p><div class="btnrow"><button class="btn sec" data-act="sheetclose">Keep going</button><button class="btn" data-act="tendok">End bake</button></div>`)},
  tendok(){closeSheet();S.session=null;sessDirty=true;wakeSync();document.body.classList.remove("focus");render()},
  focus(){const b=document.body;b.classList.toggle("focus");try{if(b.classList.contains("focus"))document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});else document.fullscreenElement&&document.exitFullscreen()}catch(e){}render()},
  fed(){S.starter.fedAt=Date.now();haptic(20);toast("Feed logged. Fridge it after 1–2 h (30–60 min if 28 °C+).");render()},
  week(a){S.weekHot=a==="1";render()},
  acc(a){S.openAcc[a]=!S.openAcc[a];render()},
  theme(a){S.theme=a;render()},
  updreload(){location.reload()},
  resetall(){sheet(`<h3>Reset everything?</h3><p class="muted">Scaling, plans, starter log and any running bake will be cleared.</p><div class="btnrow"><button class="btn sec" data-act="sheetclose">Cancel</button><button class="btn" data-act="resetok">Reset</button></div>`)},
  resetok(){closeSheet(true);S=sanitize(fresh());S.epoch=newEpoch();S.rev=1;seenRev=1;sessDirty=false;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}PLAN_NONE={};wakeSync();document.body.classList.remove("focus");skipSave=true;render();skipSave=false;toast("Everything was reset")},
  export(){exportData()},
  importok(){if(!pendingImport)return;const ui=keepUI(),sess=S.session;S=Object.assign(pendingImport,ui,{session:sess,epoch:S.epoch,rev:S.rev});pendingImport=null;closeSheet();PLAN_NONE={};render();saveNow();toast("Imported")},
  ddtT(d){S.ddt.target=clamp(S.ddt.target+.5*d,18,32);render()},
  ddtF(d){S.ddt.flour=clamp((S.ddt.flour??S.temp)+ +d,-5,45);render()},
  ddtL(d){S.ddt.lev=clamp((S.ddt.lev??S.temp)+ +d,-5,45);render()},
  ddtX(d){S.ddt.fric=clamp(S.ddt.fric+ +d,0,20);render()},
  ddtreset(){S.ddt=Object.assign({},DDT_DEFAULT);render()}
};
/* press-and-hold on steppers repeats; the click that ends a hold is swallowed */
let repT=0,repFired=false,swallowUntil=0;
function repStop(){clearTimeout(repT);repT=0;if(repFired){repFired=false;swallowUntil=Date.now()+350}}
document.addEventListener("pointerdown",e=>{unlockAudio();repStop();swallowUntil=0;const b=e.target.closest(".stepper button[data-act]");if(!b||b.disabled)return;const act=b.dataset.act,arg=b.dataset.arg;
  let n=0;repT=setTimeout(function tick(){repFired=true;n++;ACT[act](arg);repT=setTimeout(tick,n>12?45:90)},450)},{passive:true});
["pointerup","pointercancel","blur"].forEach(t=>window.addEventListener(t,repStop));
document.addEventListener("click",e=>{if(Date.now()<swallowUntil){swallowUntil=0;e.preventDefault();return}const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset.arg)}});
document.addEventListener("input",e=>{
  if(e.target.id==="hyd"){const r=S.detail,L=LEAN[r],v=+e.target.value;S.hyd[r]=v;e.target.style.setProperty("--p",((v-L.Hmin)/(L.Hmax-L.Hmin)*100)+"%");$("#hval").innerHTML=`${v.toFixed(1)}<small>%</small>`;$("#ingbox").innerHTML=ingBox(r,calc(r));save()}
});
document.addEventListener("change",e=>{
  if(e.target.id==="hyd")render();
  const inp=e.target.dataset&&e.target.dataset.inp;
  if(inp){const v=parseFloat(String(e.target.value).replace(",","."));if(Number.isFinite(v)){const sc=S.scale;
    const step={bw:.5,ddtT:.5}[inp]||1,r=Math.round(v/step)*step,lo=+e.target.min,hi=+e.target.max,c=clamp(r,lo,hi);
    ({loafw:()=>sc.loaf.w=c,bw:()=>sc.pizza.bw=c,trayw:()=>sc.focaccia.cw=c,trayl:()=>sc.focaccia.cl=c,ddtT:()=>S.ddt.target=c,ddtF:()=>S.ddt.flour=c,ddtL:()=>S.ddt.lev=c,ddtX:()=>S.ddt.fric=c}[inp]||(()=>0))();
    if(c!==r)toast(`Kept within ${gnum(lo)}–${gnum(hi)}`)}render();return}
  if(e.target.id==="dtin"){const t=String(e.target.value).trim();if(t===""){setDoughT(null);return}const v=parseFloat(t.replace(",","."));if(Number.isFinite(v))setDoughT(Math.round(v*2)/2);return}
  if(e.target.id==="pawayf"||e.target.id==="pawayt"){const v=e.target.value;if(parseClock(v)!==null){S.plan.away[e.target.id==="pawayf"?"from":"to"]=v;render()}return}
  if(e.target.id==="impfile"){const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;if(f.size>1e6){toast("That file is too big to be an export from this app.");return}f.text().then(previewImport).catch(()=>toast("Couldn't read that file."));return}
  if(e.target.id==="ptime"){const v=e.target.value;if(parseClock(v)!==null){if(S.plan.mode==="finish")S.plan.anchor[S.rid]=v;else S.plan.start=v;S.plan.custom[S.rid]=true;render()}}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.inp){e.target.blur();return}if(S.tab==="timer"&&S.session&&e.code==="Space"&&e.target===document.body){e.preventDefault();ACT.tplay()}});
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&document.body.classList.contains("focus")){document.body.classList.remove("focus");render()}});
// another tab changed the data: take its data but keep this tab's own screen.
// Removal (storage cleared elsewhere) resets this tab to defaults without writing anything back.
window.addEventListener("storage",e=>{if(e.key!==KEY&&e.key!==null)return;
  if(e.newValue===null||e.key===null){const ui=keepUI();S=sanitize(fresh());Object.assign(S,ui);S.epoch=newEpoch();seenRev=0;PLAN_NONE={};closeSheet(true);wakeSync();skipSave=true;render();skipSave=false;toast("The app's data was cleared in another tab");return}
  let o;try{o=JSON.parse(e.newValue)}catch(x){return}if(!o)return;
  const resetElsewhere=o.epoch!==S.epoch;
  if(resetElsewhere){adoptStored(o,"Everything was reset or replaced in another tab");return}
  const ui=keepUI();S=sanitize(merge(fresh(),o));Object.assign(S,ui);seenRev=S.rev;
  if(!document.querySelector(".sheet")&&!(document.activeElement&&document.activeElement.matches&&document.activeElement.matches("input"))){skipSave=true;render();skipSave=false}else updateTimerDom()});
window.addEventListener("popstate",()=>{if(document.querySelector(".sheet")){closeSheet();return}if(S.detail){S.detail=null;render("pop")}});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>render());

/* ---------- boot ---------- */
function boot(){
  $("#view").addEventListener("scroll",onScroll,{passive:true});
  if(S.detail){try{history.replaceState(null,"");history.pushState({v:"detail"},"")}catch(e){}}
  const ss=S.session;if(ss&&ss.running&&remNow()<=0&&!ss.alerted){const at=new Date(ss.endsAt);ss.running=false;ss.remaining=0;ss.alerted=true;ss.closedEnd=true;sessDirty=true;saveNow();
    setTimeout(()=>toast(`Step ${ss.idx+1} finished at ${fmtClock(at.getHours()*60+at.getMinutes())}${relDay(at)==="Today"?"":" "+relDay(at).toLowerCase()} while the app was closed.`),400)}
  if(S.tab==="plan")ensurePlan(S.rid,true);
  wakeSync();
  registerSW();
  render("enter");
}
/* ---------- offline: service worker ---------- */
function registerSW(){
  if(!("serviceWorker"in navigator)||!location.protocol.startsWith("http"))return;
  let had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had)showUpdate();had=true});
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").then(reg=>{
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)reg.update().catch(()=>{})});
  }).catch(()=>{})});
}
function showUpdate(){if(document.querySelector(".updbar"))return;const d=document.createElement("div");d.className="updbar";d.setAttribute("role","status");
  d.innerHTML=`<span>A new version of the app is ready.</span><button data-act="updreload">Reload</button>`;document.body.appendChild(d)}
boot();

</script>
