  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--tabh:62px;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#1A1410;--card:#261D17;--ink:#F4EADF;--ink2:#CDB9A7;--ink3:#8F7B6B;--terra:#D86C40;--terra2:#E58A5E;--terra-soft:#3A2418;
  --wheat:#30251D;--wheat2:#3D2F25;--olive:#9DAA74;--olive-soft:#273021;--heat:#3A2419;--heat2:#E8834D;--cold:#8FA8B8;--cold-soft:#1F2A30;
  --line:rgba(255,236,215,.08);--line2:rgba(255,236,215,.14);--nav:rgba(26,20,16,.8);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--shadow-lg:0 2px 6px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#1A1410;--card:#261D17;--ink:#F4EADF;--ink2:#CDB9A7;--ink3:#8F7B6B;--terra:#D86C40;--terra2:#E58A5E;--terra-soft:#3A2418;
  --wheat:#30251D;--wheat2:#3D2F25;--olive:#9DAA74;--olive-soft:#273021;--heat:#3A2419;--heat2:#E8834D;--cold:#8FA8B8;--cold-soft:#1F2A30;
  --line:rgba(255,236,215,.08);--line2:rgba(255,236,215,.14);--nav:rgba(26,20,16,.8);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--shadow-lg:0 2px 6px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums lining-nums}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.view{position:absolute;inset:0;bottom:calc(var(--tabh) + var(--sab));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scroll-behavior:auto}
.view.enter{animation:fadeUp .32s var(--ease)}
.view.push{animation:pushIn .38s var(--ease)}
.view.pop{animation:popIn .32s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pushIn{from{transform:translateX(34%);opacity:.3}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:translateX(-18%);opacity:.4}to{transform:none;opacity:1}}
.wrap{padding:0 18px 28px;max-width:640px;margin:0 auto}
/* nav */
.nav{position:sticky;top:0;z-index:20;height:calc(48px + var(--sat));padding-top:var(--sat);display:flex;align-items:center;justify-content:center;transition:background .2s,box-shadow .2s}
.nav .t{font-family:var(--sans);font-weight:700;font-size:16px;opacity:0;transform:translateY(4px);transition:all .22s var(--ease)}
.nav.solid{background:var(--nav);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);box-shadow:0 .5px 0 var(--line2)}
.nav.solid .t{opacity:1;transform:none}
.nav .left,.nav .right{position:absolute;top:var(--sat);height:48px;display:flex;align-items:center}
.nav .left{left:6px}.nav .right{right:10px}
.back{display:flex;align-items:center;gap:2px;color:var(--terra);font-weight:600;font-size:17px;padding:8px 10px;border-radius:12px}
.back svg{width:22px;height:22px}
.iconbtn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--terra)}
.iconbtn svg{width:22px;height:22px}
.large{padding:2px 18px 10px;max-width:640px;margin:0 auto}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--terra)}
h1.lt{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.08;margin:4px 0 0;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:15px;margin-top:6px}
h2.sh{font-family:var(--serif);font-weight:600;font-size:21px;margin:26px 0 10px;letter-spacing:-.005em}
h2.sh small{font-family:var(--sans);font-weight:500;font-size:13px;color:var(--ink3);margin-left:6px}
h3{font-family:var(--serif);font-weight:600;font-size:17px;margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--ink2)}.faint{color:var(--ink3);font-size:13px}
/* cards */
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card.tint{background:var(--wheat);box-shadow:none}
.card.heat{background:var(--heat);box-shadow:none;border-left:4px solid var(--heat2)}
.card.olive{background:var(--olive-soft);box-shadow:none;border-left:4px solid var(--olive)}
.card .ct{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink3);margin-bottom:8px}
.card.heat .ct{color:var(--heat2)}.card.olive .ct{color:var(--olive)}
.pressable{transition:transform .18s var(--ease),box-shadow .18s}
.pressable:active{transform:scale(.975)}
/* recipe cards */
.rcard{display:block;width:100%;text-align:left;background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.rcard .art{height:168px;position:relative;overflow:hidden}
.rcard .art svg{position:absolute;inset:0;width:100%;height:100%}
.rcard .body{padding:14px 16px 16px}
.rcard .name{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.15}
.rcard .desc{color:var(--ink2);font-size:14.5px;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--wheat);color:var(--ink2);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
.chip.t{background:var(--terra-soft);color:var(--terra2)}
.chip.o{background:var(--olive-soft);color:var(--olive)}
.chip.c{background:var(--cold-soft);color:var(--cold)}
.chip.h{background:var(--heat);color:var(--heat2)}
/* hero */
.hero{position:relative;height:250px;margin-top:calc(-48px - var(--sat));overflow:hidden}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .scrim{position:absolute;inset:auto 0 0 0;height:60%;background:linear-gradient(to top,rgba(30,18,10,.55),transparent)}
.hero .ht{position:absolute;left:18px;right:18px;bottom:16px;color:#FFF6EA}
.hero .ht h1{font-family:var(--serif);font-weight:600;font-size:32px;margin:0;line-height:1.05;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.hero .ht .kicker{color:#F7C9A6}
.nav.over:not(.solid) .back,.nav.over:not(.solid) .iconbtn{color:#fff;background:rgba(30,18,10,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.nav.over:not(.solid) .back{padding:8px 12px 8px 6px}
/* segmented */
.seg{display:flex;background:var(--wheat);border-radius:12px;padding:3px;gap:2px;position:relative}
.seg button{flex:1;min-height:38px;border-radius:9px;font-weight:600;font-size:14.5px;color:var(--ink2);transition:all .2s var(--ease);white-space:nowrap;padding:0 8px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(59,42,32,.14),0 1px 1px rgba(59,42,32,.06)}
.seg.sticky{position:sticky;top:calc(48px + var(--sat));z-index:15;margin:0 -18px;padding:8px 18px;border-radius:0;background:var(--nav);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.seg.sticky .inner{display:flex;background:var(--wheat);border-radius:12px;padding:3px;gap:2px;width:100%}
/* stepper */
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ctrl:last-child{border-bottom:0;padding-bottom:2px}
.ctrl:first-child{padding-top:2px}
.ctrl .lab{font-weight:600}
.ctrl .lab small{display:block;font-weight:400;color:var(--ink3);font-size:13px}
.stepper{display:flex;align-items:center;background:var(--wheat);border-radius:14px;padding:3px;flex-shrink:0}
.stepper button{width:44px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--terra);font-size:22px;font-weight:600;transition:background .15s}
.stepper button:active{background:var(--wheat2)}
.stepper button:disabled{color:var(--ink3);opacity:.5}
.stepper .val{min-width:76px;text-align:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.stepper .val small{font-weight:500;color:var(--ink3);font-size:13px;margin-left:2px}
.pillrow{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 6px;margin:0 -18px;scrollbar-width:none;scroll-snap-type:x proximity}
.pillrow::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;scroll-snap-align:start;border-radius:16px;padding:10px 14px;background:var(--card);box-shadow:var(--shadow);font-weight:600;font-size:14px;text-align:left;border:2px solid transparent;transition:all .18s var(--ease)}
.pill small{display:block;font-weight:500;color:var(--ink3);font-size:12px}
.pill.on{border-color:var(--terra);background:var(--terra-soft);color:var(--terra2)}
.pill.on small{color:var(--terra2);opacity:.8}
.rpick{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:4px 18px 10px;scrollbar-width:none}
.rpick::-webkit-scrollbar{display:none}
.rpick button{flex-shrink:0;width:92px;text-align:center;font-weight:600;font-size:13px;color:var(--ink2)}
.rpick .th{width:92px;height:72px;border-radius:18px;overflow:hidden;position:relative;margin-bottom:6px;box-shadow:var(--shadow);border:3px solid transparent;transition:all .2s var(--ease)}
.rpick .th svg{position:absolute;inset:0;width:100%;height:100%}
.rpick button.on{color:var(--terra2)}
.rpick button.on .th{border-color:var(--terra);transform:translateY(-2px)}
/* slider */
.slider{padding:6px 0 2px}
.slider .top{display:flex;justify-content:space-between;align-items:baseline}
.slider .big{font-family:var(--serif);font-weight:600;font-size:30px;color:var(--terra2)}
.slider .big small{font-size:16px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:6px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--terra) 0,var(--terra) var(--p,50%),var(--wheat2) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;margin-top:-11px;box-shadow:0 1px 3px rgba(0,0,0,.25),0 4px 10px rgba(59,42,32,.18);border:.5px solid rgba(0,0,0,.06)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--wheat2)}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--terra)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3)}
.mark{font-size:12.5px;color:var(--ink3)}
/* ingredients */
.ing{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:0}
.ing .n{flex:1;min-width:0}
.ing .n small{display:block;color:var(--ink3);font-size:13px}
.ing .g{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ing .g small{font-weight:500;color:var(--ink3);font-size:13px;margin-left:1px}
.ing .p{width:58px;text-align:right;color:var(--ink3);font-size:13.5px;font-variant-numeric:tabular-nums}
.ing.total{border-top:2px solid var(--terra);border-bottom:0;margin-top:2px}
.ing.total .n{font-weight:700}
.ing.total .g{color:var(--terra2);font-size:20px}
.grp{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--terra);margin:14px 0 0}
.grp:first-child{margin-top:0}
.flash{animation:flash .5s var(--ease)}
@keyframes flash{0%{color:var(--terra)}100%{}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--wheat);border-radius:16px;padding:10px 12px}
.stat b{display:block;font-family:var(--serif);font-weight:600;font-size:22px;color:var(--terra2);font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{font-size:12.5px;color:var(--ink2)}
/* build */
.build{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.build .b{flex:1;min-width:70px;background:var(--card);border-radius:14px;padding:8px 6px;text-align:center}
.build .b b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.build .b span{font-size:12px;color:var(--ink3)}
.build .plus{color:var(--ink3);font-weight:700}
/* method */
.steps{position:relative}
.step{display:flex;gap:14px;padding-bottom:18px;position:relative}
.step:not(:last-child)::before{content:"";position:absolute;left:15px;top:34px;bottom:2px;width:2px;background:var(--wheat2);border-radius:1px}
.step .dot{flex-shrink:0;width:32px;height:32px;border-radius:16px;background:var(--terra-soft);color:var(--terra2);display:grid;place-items:center;font-weight:700;font-size:14px}
.step .tx b{display:block;font-size:16px;margin:4px 0 2px}
.step .tx span{color:var(--ink2);font-size:14.5px}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;padding:0 8px 8px 0;border-bottom:2px solid var(--terra)}
.tbl td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-right:0}
.tbl tr.hl td{color:var(--terra2);font-weight:700}
/* accordion */
.acc{background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.acc>button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:15px 16px;font-weight:700;min-height:54px}
.acc>button .ch{margin-left:auto;transition:transform .25s var(--ease);color:var(--ink3)}
.acc.open>button .ch{transform:rotate(90deg)}
.acc .ab{display:none;padding:0 16px 16px}
.acc.open .ab{display:block;animation:fadeUp .25s var(--ease)}
.trow{padding:10px 0;border-top:1px solid var(--line)}
.trow b{display:block}
.trow .cause{color:var(--ink3);font-size:13.5px}
.trow .fix{color:var(--ink2);font-size:14.5px;margin-top:2px}
.trow .fix::before{content:"Fix: ";font-weight:700;color:var(--olive)}
ul.clean{margin:0;padding:0;list-style:none}
ul.clean li{position:relative;padding:6px 0 6px 22px}
ul.clean li::before{content:"";position:absolute;left:4px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--terra)}
ul.clean.ok li::before{background:var(--olive)}
ul.clean.bad li::before{background:#B23A2E}
ol.rules{margin:0;padding:0;list-style:none;counter-reset:r}
ol.rules li{counter-increment:r;display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
ol.rules li:last-child{border-bottom:0}
ol.rules li::before{content:counter(r);flex-shrink:0;width:26px;height:26px;border-radius:13px;background:var(--terra);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:16px;font-weight:700;font-size:17px;background:var(--terra);color:#fff;box-shadow:0 6px 18px rgba(181,86,47,.32);transition:transform .15s var(--ease),filter .15s}
.btn:active{transform:scale(.97);filter:brightness(.95)}
.btn.sec{background:var(--wheat);color:var(--terra2);box-shadow:none}
.btn.ghost{background:transparent;color:var(--terra);box-shadow:none;border:1.5px solid var(--line2)}
.btn svg{width:20px;height:20px}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabh) + var(--sab));padding-bottom:var(--sab);display:flex;background:var(--nav);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);box-shadow:0 -.5px 0 var(--line2);z-index:40}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink3);position:relative;transition:color .2s}
.tabbar button svg{width:26px;height:26px;transition:transform .25s var(--ease)}
.tabbar button.on{color:var(--terra)}
.tabbar button.on svg{transform:translateY(-1px) scale(1.06)}
.tabbar .badge{position:absolute;top:7px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--heat2);box-shadow:0 0 0 2px var(--bg);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
/* now baking pill */
.nowpill{position:fixed;left:12px;right:12px;bottom:calc(var(--tabh) + var(--sab) + 10px);z-index:35;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:20px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow-lg);animation:fadeUp .35s var(--ease);max-width:616px;margin:0 auto}
.nowpill .mini{width:40px;height:40px;flex-shrink:0}
.nowpill .tt{flex:1;min-width:0}
.nowpill .tt b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowpill .tt span{font-size:12.5px;opacity:.7}
.nowpill .cd{font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.has-pill .wrap{padding-bottom:96px}
/* planner timeline */
.daytag{position:sticky;top:calc(48px + var(--sat));z-index:5;display:flex;align-items:center;gap:8px;padding:10px 0 8px;background:var(--bg);font-weight:700;font-size:14px}
.daytag .dd{background:var(--ink);color:var(--bg);padding:3px 10px;border-radius:999px;font-size:12.5px;letter-spacing:.04em}
.daytag .rel{color:var(--ink3);font-weight:600;font-size:13px}
.tl{position:relative}
.ev{display:grid;grid-template-columns:54px 22px 1fr;gap:0 8px;position:relative;min-height:56px}
.ev .tm{font-weight:700;font-variant-numeric:tabular-nums;font-size:16px;padding-top:12px;text-align:right}
.ev .rail{position:relative;display:flex;justify-content:center}
.ev .rail::before{content:"";position:absolute;top:0;bottom:0;width:3px;border-radius:2px;background:var(--seg,var(--wheat2))}
.ev .rail i{position:relative;z-index:1;margin-top:13px;width:16px;height:16px;border-radius:50%;background:var(--card);border:3.5px solid var(--seg,var(--terra))}
.ev .bx{padding:8px 0 10px}
.ev .bx .in{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px}
.ev .bx b{display:block;font-size:15.5px;line-height:1.25}
.ev .bx .d{font-size:13.5px;color:var(--ink2);margin-top:2px}
.ev .bx .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.ev .bar{height:6px;border-radius:3px;background:var(--seg);opacity:.85;min-width:6px}
.ev.anchor .bx .in{background:var(--terra);color:#fff;box-shadow:0 8px 22px rgba(181,86,47,.35)}
.ev.anchor .bx .d{color:rgba(255,255,255,.85)}
.ev.anchor .chip{background:rgba(255,255,255,.2);color:#fff}
.k-prep{--seg:var(--terra)}.k-wait{--seg:#C9A77E}.k-cold{--seg:var(--cold)}.k-oven{--seg:var(--heat2)}.k-rest{--seg:var(--olive)}
.overview{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin:10px 0 6px}
.overview i{display:block;height:100%;background:var(--seg)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--seg)}
.sum{display:flex;align-items:stretch;gap:10px}
.sum>div{flex:1;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px}
.sum b{display:block;font-family:var(--serif);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums}
.sum span{font-size:12.5px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.sum .arrow{flex:0;display:grid;place-items:center;background:none;box-shadow:none;padding:0;color:var(--ink3)}
.timepick{display:flex;align-items:center;gap:8px}
.timepick input[type=time]{appearance:none;-webkit-appearance:none;border:0;background:var(--wheat);border-radius:14px;height:46px;padding:0 12px;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;min-width:110px;text-align:center;color:var(--ink)}
.timepick .sm{width:46px;height:46px;border-radius:14px;background:var(--wheat);color:var(--terra);font-weight:700;font-size:14px}
.guide{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.guide .g{background:var(--card);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.guide .g>span{display:block;font-size:12px;color:var(--ink3);font-weight:600;line-height:1.3}
.guide .g b{display:block;font-size:17px;margin-top:3px;line-height:1.25}
.guide .g.wide{grid-column:1/-1}
.est{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--heat2);margin-left:4px}
.tempdial{display:flex;align-items:center;gap:14px}
.thermo{width:54px;height:54px;border-radius:27px;display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:15px;color:#fff;flex-shrink:0;transition:background .3s}
/* timer */
.timerv{background:radial-gradient(120% 70% at 50% 0%,#5A3524 0%,#2B1D15 55%,#1E1510 100%);color:#FBEFE2;bottom:0;z-index:30}
.timerv .nav.solid{background:rgba(30,21,16,.8);box-shadow:none}
.timerv .nav .t{color:#FBEFE2}
.timerv .iconbtn{color:#F7C9A6}
.timerv.inline{bottom:calc(var(--tabh) + var(--sab));z-index:1}
.ringwrap{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:6px auto 0}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px}
.ringwrap .cd{font-weight:600;font-size:clamp(44px,14vw,60px);font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.ringwrap .lbl{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#E8B892;font-weight:700;margin-bottom:8px}
.ringwrap .of{font-size:14px;color:rgba(251,239,226,.6);margin-top:8px}
.ring-bg{stroke:rgba(255,255,255,.09)}
.ring-fg{stroke:url(#rg);transition:stroke-dashoffset .9s linear}
.ringwrap.done .ring-fg{stroke:#9DB26B}
.ringwrap.done .cd{color:#C9DC9A}
.tstep{text-align:center;padding:0 20px;margin-top:14px}
.tstep .no{font-size:13px;color:#E8B892;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.tstep h2{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.15;margin:6px 0 8px}
.tstep p{color:rgba(251,239,226,.78);font-size:15px;margin:0 auto;max-width:420px}
.cue{display:inline-flex;gap:8px;align-items:flex-start;text-align:left;background:rgba(157,178,107,.16);color:#D6E4B4;border-radius:14px;padding:9px 12px;font-size:14.5px;margin-top:12px;max-width:440px}
.cue b{color:#E7F0CF}
.tctl{display:flex;align-items:center;justify-content:center;gap:22px;margin:22px 0 6px}
.tctl .rb{width:58px;height:58px;border-radius:29px;background:rgba(255,255,255,.09);display:grid;place-items:center;color:#FBEFE2;transition:transform .15s,background .15s}
.tctl .rb:disabled{opacity:.3}
.tctl .rb svg{width:26px;height:26px}
.tctl .rb small{display:none}
.tctl .play{width:84px;height:84px;border-radius:42px;background:linear-gradient(160deg,#D9733F,#B5562F);box-shadow:0 10px 30px rgba(217,115,63,.45);display:grid;place-items:center;color:#fff;transition:transform .15s}
.tctl .play svg{width:36px;height:36px}
.tctl button:active{transform:scale(.92)}
.tsmall{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 16px 0}
.tsmall button{border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.08);color:#F3DCC8;font-weight:600;font-size:14px}
.tsmall button.on{background:rgba(217,115,63,.3);color:#fff}
.nextbtn{display:block;margin:18px auto 0;width:calc(100% - 40px);max-width:420px}
.done-pulse{animation:dp 1.4s infinite}
@keyframes dp{0%,100%{box-shadow:0 0 0 0 rgba(157,178,107,.6)}50%{box-shadow:0 0 0 14px rgba(157,178,107,0)}}
.overall{margin:18px 20px 0;}
.overall .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.overall .bar i{display:block;height:100%;background:linear-gradient(90deg,#D9733F,#F2B27F);border-radius:3px}
.overall .lab{display:flex;justify-content:space-between;font-size:12.5px;color:rgba(251,239,226,.6);margin-top:6px}
.scards{display:flex;gap:10px;overflow-x:auto;padding:16px 20px 26px;scroll-snap-type:x mandatory;scrollbar-width:none}
.scards::-webkit-scrollbar{display:none}
.scard{flex-shrink:0;width:150px;scroll-snap-align:center;text-align:left;border-radius:18px;padding:12px;background:rgba(255,255,255,.06);color:#F3DCC8;border:1.5px solid transparent;transition:all .2s var(--ease)}
.scard .sn{font-size:12px;font-weight:700;color:#E8B892}
.scard b{display:block;font-size:14px;line-height:1.25;margin:4px 0;color:#FBEFE2}
.scard span{font-size:12.5px;opacity:.7}
.scard.cur{border-color:#D9733F;background:rgba(217,115,63,.16)}
.scard.past{opacity:.45}
.scard.past .sn::after{content:" ✓"}
.tstart .wrap{color:#FBEFE2}
.tstart .card{background:rgba(255,255,255,.06);box-shadow:none;color:#FBEFE2}
.tstart .rpick button{color:rgba(251,239,226,.7)}
.tstart .rpick button.on{color:#F7C9A6}
.tstart .faint,.tstart .muted{color:rgba(251,239,226,.6)}
.tstart .slist{margin:0;padding:0;list-style:none}
.tstart .slist li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);align-items:center}
.tstart .slist li:last-child{border-bottom:0}
.tstart .slist .i{width:26px;height:26px;border-radius:13px;background:rgba(217,115,63,.22);color:#F7C9A6;font-weight:700;font-size:12.5px;display:grid;place-items:center;flex-shrink:0}
.tstart .slist .x{flex:1}
.tstart .slist .du{font-variant-numeric:tabular-nums;color:rgba(251,239,226,.65);font-size:14px;white-space:nowrap}
.tstart .slist button{color:#F7C9A6;font-weight:600;font-size:13px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.06)}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 12px);transform:translate(-50%,-20px);opacity:0;z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:600;font-size:14.5px;box-shadow:var(--shadow-lg);transition:all .3s var(--ease);pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet-bg{position:fixed;inset:0;background:rgba(20,12,8,.4);z-index:70;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 18px calc(18px + var(--sab));max-height:86vh;overflow-y:auto;animation:sheetUp .35s var(--ease);max-width:680px;margin:0 auto}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
@keyframes sheetUp{from{transform:translateY(100%)}}
.feed{display:flex;align-items:center;gap:16px}
.jar{width:74px;flex-shrink:0}
.feed .days{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1}
.eq{font-family:var(--serif);font-size:17px;text-align:center;padding:6px 0}
.eq .fr{display:inline-flex;flex-direction:column;vertical-align:middle;margin:0 6px;text-align:center}
.eq .fr span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px 2px}
.eq .fr span:last-child{padding:2px 4px 0}
.hscroll{overflow-x:auto;margin:0 -16px;padding:0 16px}
.wtable{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center}
.wtable div{background:var(--wheat);border-radius:12px;padding:8px 2px}
.wtable div b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.wtable div span{font-size:12px;color:var(--ink3)}
.wtable div.on{background:var(--terra);color:#fff}
.wtable div.on span{color:rgba(255,255,255,.8)}
.home-top{display:flex;align-items:flex-end;justify-content:space-between}
.starterchip{display:flex;align-items:center;gap:12px}
.spacer{height:12px}
.center{text-align:center}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--heat);color:var(--heat2)}
@media (min-width:700px){.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.rgrid .rcard{margin:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.focus .tabbar,body.focus .nowpill{display:none!important}
body.focus .view{bottom:0}
body.ontimer .tabbar{background:rgba(30,21,16,.88);box-shadow:0 -.5px 0 rgba(255,255,255,.08)}
body.ontimer .tabbar button{color:rgba(251,239,226,.45)}
body.ontimer .tabbar button.on{color:#F2B27F}
body.ontimer .tabbar .badge{box-shadow:0 0 0 2px #1E1510}
.timerv .large .kicker{color:#F2B27F}
.timerv h1.lt{color:#FBEFE2}
.timerv .card .ct{color:rgba(251,239,226,.5)}

.guide .g .est{display:inline;font-size:9.5px;margin-left:6px;padding:1px 5px;border-radius:6px;background:var(--heatbg,rgba(217,115,63,.12));vertical-align:1px}
.warnbar{display:flex;gap:10px;align-items:flex-start;background:rgba(217,115,63,.12);color:var(--heat2);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:600;margin-top:10px;line-height:1.35}
.build{flex-wrap:nowrap;gap:4px}
.build .b{min-width:0;padding:8px 2px}
.build .b.tot{background:var(--terra);color:#fff}
.build .b.tot span{color:rgba(255,255,255,.8)}
.card .pillrow{margin:0 -16px;padding:2px 16px 4px;scroll-padding:0 16px}
.card .pill{background:var(--wheat);box-shadow:none}
.card .pill.on{background:var(--terra-soft)}

.nowpill{background:rgba(43,29,21,.94);color:#FBEFE2;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
[data-theme=dark] .nowpill{box-shadow:0 0 0 .5px rgba(255,236,215,.12),0 10px 30px rgba(0,0,0,.5)}
@media (prefers-color-scheme:dark){.nowpill{box-shadow:0 0 0 .5px rgba(255,236,215,.12),0 10px 30px rgba(0,0,0,.5)}}

</style>
</head>

<div id="app">
  <main id="view" class="view"></main>
  <div id="pill" class="nowpill" data-act="tab" data-arg="timer" style="display:none"></div>
  <nav class="tabbar" aria-label="Main">
    <button data-act="tab" data-arg="recipes" class="on" aria-label="Recipes"><span id="i-recipes"></span>Recipes</button>

    <button data-act="tab" data-arg="starter" aria-label="Starter"><span id="i-starter"></span>Starter</button>

  </nav>
</div>

const $=(s,r=document)=>r.querySelector(s);

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function gnum(x){if(x>=1000)return Math.round(x).toLocaleString("en-GB");if(x>=20)return String(Math.round(x));return String(Math.round(x*2)/2)}
const G=x=>`${gnum(x)}<small>g</small>`;
const gt=x=>`${gnum(x)} g`;
const pc=x=>`${(x*100).toFixed(1)}%`;
function fmtDur(min){const m=Math.max(0,Math.round(min)),h=Math.floor(m/60),r=m%60;if(!h)return`${r} min`;return r?`${h} h ${r} min`:`${h} h`}
function fmtClock(min){const m=((Math.round(min)%1440)+1440)%1440;return`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`}
function fmtCD(sec){const s=Math.max(0,Math.ceil(sec)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;const mm=String(m).padStart(2,"0"),ss=String(r).padStart(2,"0");return h?`${h}:${mm}:${ss}`:`${mm}:${ss}`}
function parseClock(s){const m=String(s||"").trim().match(/^(\d{1,2})[:.]?(\d{2})$/);if(!m)return null;const h=+m[1],mi=+m[2];if(h>23||mi>59)return null;return h*60+mi}
function isoDate(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function fromIso(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dayName(d){return`${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`}
function relDay(d){const t=new Date();t.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);const diff=Math.round((x-t)/864e5);return diff===0?"Today":diff===1?"Tomorrow":diff===-1?"Yesterday":diff>1?`In ${diff} days`:`${-diff} days ago`}
function waterPct(L,H){return H/100*(1+L.L/2)-L.L/2}

/* ---------- calculations ---------- */
function calc(rid){
  const st=S.scale[rid];
  if(rid==="sandwich"){
    const n=clamp(st.n,1,6),f=(st.tin==="large"?1:.75)*n,total=SANDWICH.reduce((a,s)=>a+s.g,0)*f;
    return{groups:["Stiff starter","Tangzhong","Main dough"].map(g=>({g,rows:SANDWICH.filter(s=>s.group===g).map(s=>({name:s.name,g:s.g*f,p:s.g/670}))})),
      total,totalPct:SANDWICH.reduce((a,s)=>a+s.g,0)/670,
      stats:[[gt(670*f),"Total flour"],["≈62%","Effective hydration"],[gt(total/n),"Per tin"],[gt(15*f),"Butter to brush"]],
      build:null,extras:[],summary:`${n} ${st.tin==="large"?"large":"2 lb"} tin${n>1?"s":""} · ${gt(total)}`}
  }
  const L=LEAN[rid],H=S.hyd[rid],w=waterPct(L,H),sum=1+w+L.L+L.salt+L.oil,sum0=1+waterPct(L,L.H0)+L.L+L.salt+L.oil;
  let F=L.baseFlour,units=1,unit="Per loaf",summary="";
  if(rid==="loaf"){if(st.mode==="loaves"){units=clamp(st.n,1,8);F=750*units}else{F=750*(clamp(st.w,300,12000)/1415)*(sum0/sum);unit="Dough"}}
  else if(rid==="focaccia"){const t=TRAYS.find(x=>x.id===st.tray)||TRAYS[0];const area=st.tray==="custom"?clamp(st.cw,10,80)*clamp(st.cl,10,80):t.area;F=500*area/759;unit="Per tray"}
  else{units=clamp(st.balls,1,24);F=600*(units*clamp(st.bw,150,400)/1104)*(sum0/sum);unit="Per ball"}
  const water=w*F,reserve=Math.min(L.reserve*F,water),lev=L.L*F,salt=L.salt*F,oil=L.oil*F,total=F+water+lev+salt+oil;
  const rows=L.flours.map(fl=>({name:fl.name,sub:fl.note,g:F*fl.pct,p:fl.pct}));
  rows.push({name:"Water",sub:"Initial mix",g:water-reserve,p:(water-reserve)/F});
  rows.push({name:"Water",sub:"Reserved, added with the salt",g:reserve,p:reserve/F});
  rows.push({name:"Levain",sub:"100% hydration, at peak",g:lev,p:L.L});
  rows.push({name:"Fine salt",sub:"",g:salt,p:L.salt});
  if(oil>0)rows.push({name:"Extra-virgin olive oil",sub:"In the dough",g:oil,p:L.oil});
  const [bm,bf,bw]=L.build,bt=bm+bf+bw,k=lev*(bt/L.need)/bt;
  const tf=F+lev/2,tw=water+lev/2;
  const extras=[];
  if(rid==="focaccia"){const a=F/500;extras.push(["Tray oil",`${gnum(25*a)}–${gt(30*a)}`],["Top oil",`${gnum(15*a)}–${gt(20*a)}`],["Optional brine",`${gt(20*a)} water + ${gt(20*a)} olive oil + pinch of salt`],["To finish","Flaky salt and rosemary"])}
  if(rid==="pizza"){extras.push(["Sauce, uncooked",`${gt(100*units)} canned tomatoes + ${gt(units)} salt · 70–80 g per pizza`],["Mozzarella, drained",`${gnum(70*units)}–${gt(90*units)} · 70–90 g per pizza`],["To finish","Basil and a little olive oil"])}
  if(rid==="loaf")summary=st.mode==="loaves"?`${units} loa${units>1?"ves":"f"} · ${gt(total)}`:`${gt(total)} dough`;
  else if(rid==="focaccia"){const t=TRAYS.find(x=>x.id===st.tray);summary=`${st.tray==="custom"?`${st.cw} × ${st.cl} cm`:t.label+(t.round?" cm":" cm")} · ${gt(total)}`}
  else summary=`${units} ball${units>1?"s":""} · ${gt(total/units)} each`;
  return{rows,total,totalPct:sum,F,units,
    stats:[[pc(tw/tf),"True hydration"],[pc(salt/tf),"Salt of total flour"],[pc(lev/2/tf),"Prefermented flour"],[gt(total/units),unit]],
    build:{m:bm*k,f:bf*k,w:bw*k,t:bt*k,use:lev},extras,summary,tw,tf};
}
function currentPlan(rid){return buildPlan(rid,band(S.temp),S.cold[rid],S.scale.pizza.balls)}
function guideFor(rid){

  else if(rid==="focaccia")g.push(["Levain to peak",LEV_FAST[b].r,1],["Mixing water",water,0],["Bulk target rise",FOC_RISE[b],0],["Bulk from levain in",LOAF_BULK[b].r,1],["Day-2 warm-up",FOC_WARM[b].r,1]);

function remNow(){const s=S.session;if(!s)return 0;return s.running?Math.max(0,(s.endsAt-Date.now())/1000):s.remaining}
function startSession(rid,from){const p=currentPlan(rid);S.session={rid,steps:p.steps.map(x=>({t:x.t,d:x.d,k:x.k,detail:x.detail,cue:x.cue||"",est:!!x.est})),anchor:p.anchor,idx:from||0,running:false,remaining:p.steps[from||0].d*60,endsAt:0,startedAt:Date.now(),alerted:false,temp:S.temp};unlockAudio();tPlay();}
function tPlay(){const s=S.session;if(!s)return;if(s.remaining<=0)s.remaining=s.steps[s.idx].d*60;s.endsAt=Date.now()+s.remaining*1000;s.running=true;s.alerted=false;saveNow();wakeSync()}
function tPause(){const s=S.session;if(!s)return;s.remaining=remNow();s.running=false;saveNow();wakeSync()}
function tGo(i,autoplay){const s=S.session;if(!s)return;s.idx=clamp(i,0,s.steps.length-1);s.remaining=s.steps[s.idx].d*60;s.running=false;s.alerted=false;if(autoplay)tPlay();saveNow()}
function tAdd(min){const s=S.session;if(!s)return;if(s.running)s.endsAt+=min*60000;else s.remaining=Math.max(0,s.remaining+min*60);if(remNow()>0)s.alerted=false;saveNow()}
let AC=null;function unlockAudio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}AC&&AC.state==="suspended"&&AC.resume()}catch(e){}}
function chime(){if(!S.sound||!AC)return;try{const t0=AC.currentTime;[0,.32,.64].forEach((o,i)=>{const os=AC.createOscillator(),g=AC.createGain();os.type="sine";os.frequency.value=[784,988,1175][i];g.gain.setValueAtTime(0,t0+o);g.gain.linearRampToValueAtTime(.28,t0+o+.02);g.gain.exponentialRampToValueAtTime(.001,t0+o+.6);os.connect(g).connect(AC.destination);os.start(t0+o);os.stop(t0+o+.65)})}catch(e){}}
function stepDone(){const s=S.session;s.running=false;s.remaining=0;s.alerted=true;saveNow();haptic([300,120,300,120,500]);chime();toast(`Step done: ${s.steps[s.idx].t}`);wakeSync();

let wakeLock=null;async function wakeSync(){try{const want=S.wake&&S.session&&S.session.running&&!document.hidden;if(want&&!wakeLock&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>{wakeLock=null})}else if(!want&&wakeLock){await wakeLock.release();wakeLock=null}}catch(e){wakeLock=null}}

/* ---------- UI primitives ---------- */
function stepper(act,val,unit,opts){opts=opts||{};return`<div class="stepper"><button data-act="${act}" data-arg="-1" aria-label="Decrease"${opts.min?" disabled":""}>−</button><div class="val num">${val}${unit?`<small>${unit}</small>`:""}</div><button data-act="${act}" data-arg="1" aria-label="Increase"${opts.max?" disabled":""}>+</button></div>`}
function seg(act,opts,val,cls){return`<div class="seg ${cls||""}">${opts.map(([v,l])=>`<button data-act="${act}" data-arg="${v}" class="${String(v)===String(val)?"on":""}">${l}</button>`).join("")}</div>`}
function nav(title,o){o=o||{};return`<header class="nav${o.over?" over":""}">${o.left||""}<div class="t">${esc(title)}</div>${o.right?`<div class="right">${o.right}</div>`:""}</header>`}
function large(k,t,sub){return`<div class="large">${k?`<div class="kicker">${k}</div>`:""}<h1 class="lt">${t}</h1>${sub?`<div class="sub">${sub}</div>`:""}</div>`}
function rpick(act,cur){return`<div class="rpick">${RIDS.map(r=>`<button data-act="${act}" data-arg="${r}" class="${r===cur?"on":""}"><div class="th">${art(r,"rp"+act+r)}</div>${RECIPES[r].short}</button>`).join("")}</div>`}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2600)}

/* ---------- views ---------- */

   <div class="spacer"></div><div class="ctrl"><div class="lab">Kitchen temperature<small>Drives every timing estimate</small></div>${stepper("temp",S.temp,"°C")}</div></div>
   <button class="card pressable starterchip" data-act="tab" data-arg="starter" style="width:100%;text-align:left"><div style="width:44px">${jarSVG(days===null?45:Math.max(15,80-days*7))}</div><div style="flex:1"><b>Mother starter</b><div class="faint">${days===null?"Log a feed to track refreshes":days===0?"Fed today":`Fed ${days} day${days>1?"s":""} ago${days>=7?" · refresh due":""}`}</div></div>${ICON.chev}</button>
  </div>`;

    body=`<div class="card"><div class="ct">Batch size</div>${ctl}</div>${hyd}<div id="ingbox">${ingBox(rid,c)}</div>
    <div class="btnrow" style="margin-top:6px"><button class="btn sec" data-act="planthis" data-arg="${rid}">${ICON.cal}Plan it</button><button class="btn" data-act="startthis" data-arg="${rid}">${ICON.play}Start bake</button></div>`;

function ingBox(rid,c){

  else list=c.rows.map(r=>`<div class="ing"><div class="n">${esc(r.name)}${r.sub?`<small>${esc(r.sub)}</small>`:""}</div><div class="g">${G(r.g)}</div><div class="p">${pc(r.p)}</div></div>`).join("");
  list+=`<div class="ing total"><div class="n">Total dough</div><div class="g">${G(c.total)}</div><div class="p">${pc(c.totalPct)}</div></div>`;
  const b=c.build;
  return`<div class="stats">${c.stats.map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("")}</div>
  <div class="card"><div class="ct" style="display:flex;justify-content:space-between"><span>Ingredients</span><span>Baker's %</span></div>${list}</div>
  ${b?`<div class="card tint"><div class="ct">Levain build · start it first</div><div class="build"><div class="b"><b>${gnum(b.m)}</b><span>mother g</span></div><span class="plus">+</span><div class="b"><b>${gnum(b.f)}</b><span>flour g</span></div><span class="plus">+</span><div class="b"><b>${gnum(b.w)}</b><span>water g</span></div></div><div class="faint" style="margin-top:8px">Makes ≈ ${gt(b.t)}, use ${gt(b.use)} at peak. ${rid==="loaf"?"5–8 h":"4–6 h"} at 24–26 °C.</div></div>`:
  `<div class="card tint"><div class="ct">Night before</div><p style="margin:0">The stiff sweet starter is the levain: build it the night before and use it all. Cook the tangzhong to 65 °C, then chill.</p></div>`}
  ${c.extras.length?`<div class="card"><div class="ct">Also needed</div>${c.extras.map(([a,v])=>`<div class="ing"><div class="n">${a}</div><div style="text-align:right;font-weight:600;font-size:14.5px;max-width:60%">${v}</div></div>`).join("")}</div>`:""}`;
}
function timeline(rid){
  const p=currentPlan(rid),steps=p.steps,cum=[];let acc=0;steps.forEach(s=>{cum.push(acc);acc+=s.d});
  const anchorEnd=cum[p.anchor]+steps[p.anchor].d;
  const at=parseClock(S.plan.mode==="finish"?S.plan.anchor[rid]:S.plan.start);
  let base0,base=S.plan.mode==="finish"?(at??540)-anchorEnd:(at??420);
  const d0=fromIso(S.plan.date);
  const ev=steps.map((s,i)=>({...s,i,st:base+cum[i]}));
  // round an estimated start down to a 5-minute mark; the extra minutes go to the first (estimated) step so the ready time stays put
  base0=base;const r=((base%5)+5)%5;if(r&&S.plan.mode==="finish"){base-=r;ev[0].st=base;ev[0].d+=r}
  ev.splice(p.anchor+1,0,{anchorMark:1,st:base0+anchorEnd,t:rid==="pizza"?"First pizza goes in":"Out of the oven",d:0,k:"oven"});
  const dt=m=>{const d=new Date(d0);d.setMinutes(d.getMinutes()+m);return d};
  return{ev,dt,total:acc,startD:dt(base),anchorD:dt(base0+anchorEnd),p};
}
function vPlan(){
  const rid=S.rid,tl=timeline(rid),mode=S.plan.mode,maxd=Math.max(...tl.ev.map(e=>e.d));
  const days=[];for(let i=0;i<8;i++){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+i);days.push(d)}
  let lastDay="",items="";
  tl.ev.forEach(e=>{const d=tl.dt(e.st),key=isoDate(d);if(key!==lastDay){lastDay=key;items+=`<div class="daytag"><span class="dd">${dayName(d)}</span><span class="rel">${relDay(d)}</span></div>`}
    const tm=`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
    if(e.anchorMark){items+=`<div class="ev anchor k-oven"><div class="tm num">${tm}</div><div class="rail"><i></i></div><div class="bx"><div class="in"><b>${e.t}</b><div class="d">${RECIPES[rid].name} · ${calc(rid).summary}</div></div></div></div>`;return}
    const w=Math.max(4,Math.sqrt(e.d/maxd)*100);
    items+=`<div class="ev k-${e.k}"><div class="tm num">${tm}</div><div class="rail"><i></i></div><div class="bx"><div class="in"><b>${esc(e.t)}</b><div class="d">${esc(e.detail)}</div><div class="meta"><span class="chip ${e.k==="cold"?"c":e.k==="oven"?"h":e.k==="rest"?"o":e.k==="prep"?"t":""}">${e.est?"≈ ":""}${fmtDur(e.d)}</span>${e.est?`<span class="est">estimate</span>`:""}<div class="bar" style="width:${w*.45}%"></div></div></div></div></div>`});
  const ov=tl.ev.filter(e=>!e.anchorMark).map(e=>`<i class="k-${e.k}" style="flex:${Math.max(e.d,8)}"></i>`).join("");
  const at=S.plan.mode==="finish"?S.plan.anchor[rid]:S.plan.start;
  return nav("Plan")+large("Start-time planner","Plan a bake","Pick a recipe, set your kitchen and when you want it ready.")+
  `<div class="wrap">${rpick("prid",rid)}
  <div class="card"><div class="ct">Your kitchen</div><div class="ctrl"><div class="tempdial"><div class="thermo num" style="background:${thermoColor(S.temp)}">${S.temp}°</div><div class="lab">${BAND_LABELS[band(S.temp)]}<small>Kitchen temperature</small></div></div>${stepper("temp",S.temp,"°C")}</div></div>
  <div class="guide">${guideFor(rid).map(([l,v,e],i)=>`<div class="g${i===0?" wide":""}"><span>${l}${e?`<span class="est">est.</span>`:""}</span><b>${v}</b></div>`).join("")}</div>
  <h2 class="sh">When</h2>
  <div class="card">${seg("pmode",[["finish",rid==="pizza"?"Pizza time":"Ready at"],["start","Start at"]],mode)}
   <div class="spacer"></div><div class="faint" style="font-weight:600;margin-bottom:6px">${mode==="finish"?(rid==="pizza"?"First pizza on":"Out of the oven on"):"Levain build starts on"}</div>
   <div class="pillrow">${days.map(d=>`<button class="pill ${isoDate(d)===S.plan.date?"on":""}" data-act="pdate" data-arg="${isoDate(d)}">${DOW[d.getDay()]}<small>${relDay(d)==="Today"||relDay(d)==="Tomorrow"?relDay(d):d.getDate()+" "+MON[d.getMonth()]}</small></button>`).join("")}</div>
   <div class="ctrl"><div class="lab">At</div><div class="timepick"><button class="sm" data-act="ptime" data-arg="-15">−15</button><input type="time" id="ptime" value="${esc(at)}" step="300" aria-label="Time"><button class="sm" data-act="ptime" data-arg="15">+15</button></div></div>
   <div class="ctrl" style="display:block"><div class="lab" style="margin-bottom:8px">Fridge stage</div>${seg("pcold",COLD_OPTS[rid].map(h=>[h,h+" h"]),S.cold[rid])}</div></div>
  <div class="sum"><div><span>Start</span><b class="num">${fmtClock(tl.startD.getHours()*60+tl.startD.getMinutes())}</b><div class="faint">${dayName(tl.startD)}</div></div><div class="arrow">${ICON.chev}</div><div><span>${rid==="pizza"?"Pizza":"Ready"}</span><b class="num">${fmtClock(tl.anchorD.getHours()*60+tl.anchorD.getMinutes())}</b><div class="faint">${dayName(tl.anchorD)}</div></div></div>
  ${tl.startD.getTime()<Date.now()-60000?`<div class="warnbar"><span>!</span><span>That start time has already passed. Pick a later ${S.plan.mode==="finish"?"ready time or day":"start time"}, or start the timer from a later step.</span></div>`:""}
  <div class="overview">${ov}</div><div class="legend"><span class="k-prep">Hands-on</span><span class="k-wait">Rising</span><span class="k-cold">Fridge</span><span class="k-oven">Oven</span><span class="k-rest">Cooling</span></div>
  <div class="faint" style="margin-top:6px">≈ marks estimates for ${S.temp} °C. If the dough runs ahead or behind, follow its cues; later steps shift with it.</div>
  <div class="tl" style="margin-top:6px">${items}</div>
  <button class="btn" data-act="startthis" data-arg="${rid}" style="margin-top:10px">${ICON.play}Start bake-day timer</button></div>`;
}
function ringSVG(frac,id){const r=130,C=2*Math.PI*r;return`<svg viewBox="0 0 300 300"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2B27F"/><stop offset="1" stop-color="#D9733F"/></linearGradient></defs><circle class="ring-bg" cx="150" cy="150" r="${r}" fill="none" stroke-width="14"/><circle id="${id}" class="ring-fg" cx="150" cy="150" r="${r}" fill="none" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-frac)).toFixed(1)}"/></svg>`}
function vTimer(){
  const s=S.session;
  if(!s){const rid=S.rid,p=currentPlan(rid),tot=p.steps.reduce((a,x)=>a+x.d,0),hands=p.steps.filter(x=>x.k==="prep").reduce((a,x)=>a+x.d,0);
    return nav("Timer")+large("Bake-day timer","Ready when you are",`<span style="color:rgba(251,239,226,.7)">Walk through every step with a countdown and a chime at the end.</span>`)+
    `<div class="wrap">${rpick("trid",rid)}<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><div class="kicker" style="color:#F2B27F">${RECIPES[rid].name}</div><b style="font-size:20px">${p.steps.length} steps · ≈ ${fmtDur(tot)}</b><div class="faint">≈ ${fmtDur(hands)} hands-on · estimates for ${S.temp} °C</div></div></div></div>
    <button class="btn" data-act="tstart" data-arg="0">${ICON.play}Start step 1 now</button><div class="spacer"></div>
    <div class="card"><div class="ct" style="color:rgba(251,239,226,.5)">Or start from a later step</div><ul class="slist">${p.steps.map((x,i)=>`<li><span class="i">${i+1}</span><span class="x">${esc(x.t)}</span><span class="du">${x.est?"≈ ":""}${fmtDur(x.d)}</span>${i?`<button data-act="tstart" data-arg="${i}">Start</button>`:""}</li>`).join("")}</ul></div></div>`;
  }
  const st=s.steps[s.idx],rem=remNow(),frac=st.d?1-rem/(st.d*60):1,done=rem<=0;
  const totalAll=s.steps.reduce((a,x)=>a+x.d,0),doneMin=s.steps.slice(0,s.idx).reduce((a,x)=>a+x.d,0)+(st.d-rem/60);
  const endT=new Date(Date.now()+rem*1000);
  return nav(RECIPES[s.rid].name,{left:`<div class="left"><button class="back" data-act="tend" style="color:#F7C9A6">${ICON.close}End</button></div>`,right:`<button class="iconbtn" data-act="focus" aria-label="Full screen">${document.body.classList.contains("focus")?ICON.shrink:ICON.expand}</button>`})+
  `<div class="overall"><div class="bar"><i data-live="obar" style="width:${(doneMin/totalAll*100).toFixed(1)}%"></i></div><div class="lab"><span>Step ${s.idx+1} of ${s.steps.length}</span><span data-live="oleft">≈ ${fmtDur(totalAll-doneMin)} to go</span></div></div>
  <div class="ringwrap ${done?"done":""}" id="ringwrap">${ringSVG(frac,"ringfg")}<div class="ctr"><div class="lbl" data-live="rlbl">${done?"Step done":s.running?"Remaining":"Paused"}</div><div class="cd num" data-live="cd">${fmtCD(rem)}</div><div class="of" data-live="rof">${done?"Check the cue below":`of ${fmtDur(st.d)}${st.est?" (estimate)":""} · ${s.running?"ends "+fmtClock(endT.getHours()*60+endT.getMinutes()):"tap play"}`}</div></div></div>
  <div class="tstep"><div class="no">Step ${s.idx+1}${st.est?" · follow the dough":""}</div><h2>${esc(st.t)}</h2><p>${esc(st.detail)}</p>${st.cue?`<div class="cue"><span>✓</span><span><b>Ready when:</b> ${esc(st.cue)}</span></div>`:""}</div>
  <div class="tctl"><button class="rb" data-act="tprev" ${s.idx===0?"disabled":""} aria-label="Previous step">${ICON.prev}</button>
   <button class="play ${done?"done-pulse":""}" data-act="${done?"tnext":"tplay"}" aria-label="${s.running?"Pause":"Start"}" id="playbtn">${done?ICON.next:s.running?ICON.pause:ICON.play}</button>
   <button class="rb" data-act="tnext" ${s.idx>=s.steps.length-1?"disabled":""} aria-label="Next step">${ICON.next}</button></div>
  <div class="tsmall"><button data-act="tadd" data-arg="-5">−5 min</button><button data-act="tadd" data-arg="5">+5 min</button><button data-act="treset">Restart step</button><button data-act="tsound" class="${S.sound?"on":""}">Sound ${S.sound?"on":"off"}</button>${"wakeLock"in navigator?`<button data-act="twake" class="${S.wake?"on":""}">Screen ${S.wake?"stays on":"may sleep"}</button>`:""}</div>
  ${done&&s.idx<s.steps.length-1?`<button class="btn nextbtn done-pulse" data-act="tnext">Next: ${esc(s.steps[s.idx+1].t)}</button>`:""}
  ${done&&s.idx===s.steps.length-1?`<button class="btn nextbtn" data-act="tend">Finish bake</button>`:""}
  <div class="scards" id="scards">${s.steps.map((x,i)=>`<button class="scard ${i===s.idx?"cur":i<s.idx?"past":""}" data-act="tgo" data-arg="${i}"><div class="sn">STEP ${i+1}</div><b>${esc(x.t)}</b><span>${x.est?"≈ ":""}${fmtDur(x.d)}</span></button>`).join("")}</div>`;
}
function vStarter(){
  const days=S.starter.fedAt?Math.floor((Date.now()-S.starter.fedAt)/864e5):null;
  const status=days===null?["Not logged yet",""]:days<7?["Fresh","o"]:days<=10?["Refresh due","h"]:["Overdue — revive","t"];
  return nav("Starter")+large("Mother & levain","Starter","Keep the mother small and cold; build a fresh levain for every bake.")+
  `<div class="wrap"><div class="card"><div class="feed"><div class="jar">${jarSVG(days===null?45:Math.max(15,80-days*7))}</div><div style="flex:1"><div class="days num">${days===null?`<span style="font-size:22px">No feed logged</span>`:days}<small style="font-size:15px;font-family:var(--sans);color:var(--ink3)"> ${days===null?"":"day"+(days===1?"":"s")+" since feeding"}</small></div>
   ${status[1]?`<span class="chip ${status[1]}" style="margin-top:8px">${status[0]}</span>`:`<div class="faint" style="margin-top:6px">Tap below after each feed.</div>`}
   ${S.starter.fedAt?`<div class="faint" style="margin-top:6px">Last fed ${dayName(new Date(S.starter.fedAt))}, ${fmtClock(new Date(S.starter.fedAt).getHours()*60+new Date(S.starter.fedAt).getMinutes())}</div>`:""}</div></div>
   <div class="spacer"></div><button class="btn" data-act="fed">I fed it just now</button></div>
  <h2 class="sh">Mother feed <small>87.5% hydration</small></h2>
  <div class="card tint"><div class="build"><div class="b"><b>20</b><span>starter g</span></div><span class="plus">+</span><div class="b"><b>40</b><span>flour g</span></div><span class="plus">+</span><div class="b"><b>35</b><span>water g</span></div><span class="plus">=</span><div class="b tot"><b>95</b><span>total g</span></div></div></div>
  <div class="card"><div class="steps">${[["Feed","Mix 20 g starter + 40 g flour + 35 g water in a clean jar. Mark the level."],["Short start at room temperature",`1–2 h (30–60 min at 28 °C+) until the first bubbles. Your kitchen is ${S.temp} °C: ${S.temp>=27?"30–60 min":"1–2 h"}.`],["Fridge before peak","3–5 °C. Refresh every 7–10 days."],["Revive if sluggish","A recovery feed left out until about doubled; repeat if needed. Emergency rebuild: 10 g + 20 g flour + 17–18 g water."]].map(([t,d],i)=>`<div class="step"><div class="dot">${i+1}</div><div class="tx"><b>${t}</b><span>${d}</span></div></div>`).join("")}</div></div>
  <h2 class="sh">Levain builds</h2>
  <div class="card"><table class="tbl"><thead><tr><th>For</th><th>Mother + flour + water</th><th class="r">Makes / use</th></tr></thead><tbody>${LEVAIN_TABLE.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td class="r">${r[2]}</td></tr>`).join("")}</tbody></table></div>
  <div class="card"><div class="ct">When is it ready?</div><p>5–8 h at 24–26 °C (3½–5 h at 28–30 °C). Use it at peak or as the dome just starts to flatten: 80–100% rise.</p><div class="chips"><span class="chip t">Your kitchen: ${LEV[band(S.temp)].r} <span class="est">est.</span></span></div></div>
  <div class="card heat"><div class="ct">Slow it down in the heat</div><ul class="clean"><li>Use 20 °C water for the build.</li><li>Halve the mother: 10 g + 75 + 75 (roughly 2–3 h longer, an estimate).</li><li>Let it rise about 50%, then refrigerate until needed.</li></ul></div>
  <div class="card"><div class="ct">Healthy</div><ul class="clean ok"><li>Bubbly, domed, predictable rise</li><li>Yogurty or mildly vinegary smell</li><li>Grey liquid on top: hungry, pour off and feed</li></ul><div class="ct" style="margin-top:12px">Discard if you see</div><ul class="clean bad"><li>Fuzzy mould</li><li>Pink, orange or red growth</li><li>A putrid smell</li></ul></div></div>`;
}
function acc(id,title,body){const o=S.openAcc[id];return`<div class="acc ${o?"open":""}"><button data-act="acc" data-arg="${id}">${title}<span class="ch">${ICON.chev}</span></button><div class="ab">${body}</div></div>`}
function vRef(){
  const wk=S.weekHot;const tb=[22,24,26,28,30,32];const near=tb.reduce((a,b)=>Math.abs(b-S.temp)<Math.abs(a-S.temp)?b:a);
  return nav("Reference")+large("Quick reference","Reference","Rules, temperatures, conversions and fixes.")+
  `<div class="wrap"><h2 class="sh">Golden rules</h2><div class="card"><ol class="rules">${RULES.map(r=>`<li>${esc(r)}</li>`).join("")}</ol></div>
  <h2 class="sh">Sample week</h2><div class="card">${seg("week",[["0","Standard"],["1","Hot season"]],wk?"1":"0")}<div class="spacer"></div>
  ${wk?`<p>Build the levain about <b>08:00</b> with 20 °C water, mix <b>11:30–12:00</b> with 15–19 °C water, and expect bulk to end about <b>15:00–16:00</b>. Shape, fridge, and bake the next morning as usual.</p>`:`<div class="tl">${WEEK.map(([w,t,k])=>`<div class="ev k-${k}" style="grid-template-columns:86px 22px 1fr"><div class="tm num" style="font-size:14px">${w}</div><div class="rail"><i></i></div><div class="bx"><div class="in" style="box-shadow:none;background:var(--bg)"><b style="font-size:14.5px;font-weight:600">${esc(t)}</b></div></div></div>`).join("")}</div>`}</div>
  <h2 class="sh">Oven temperatures</h2><div class="card"><table class="tbl"><thead><tr><th>Bake</th><th class="r">Conv.</th><th class="r">Fan</th><th class="r">°F</th></tr></thead><tbody>${OVENS.map(r=>`<tr><td>${r[0]}</td><td class="r">${r[1]}</td><td class="r">${r[2]}</td><td class="r">${r[3]}</td></tr>`).join("")}</tbody></table></div>
  <h2 class="sh">Water temperature <small>for a 25 °C dough</small></h2><div class="card"><div class="wtable">${tb.map(t=>`<div class="${t===near?"on":""}"><span>room ${t}°</span><b>${75-2*t}°</b></div>`).join("")}</div><div class="eq" style="margin-top:10px">Water °C = (25 × 3) − room °C − flour °C</div></div>
  <div class="card"><div class="ct">True hydration</div><div class="eq">Hydration = <span class="fr"><span>water + ½ levain</span><span>flour + ½ levain</span></span> × 100</div><div class="faint">Levain at 100% hydration is half flour, half water.</div></div>
  <h2 class="sh">Cues</h2><div class="card">
   <div class="ing"><div class="n">Lean loaf done</div><b>96–98 °C</b></div><div class="ing"><div class="n">Sandwich loaf done</div><b>93–96 °C</b></div>
   <div class="ct" style="margin-top:12px">Poke test</div><ul class="clean"><li><b>Springs straight back:</b> needs more time</li><li><b>Fills back slowly:</b> ready</li><li><b>Stays dented:</b> over-proofed, bake now</li></ul></div>
  <h2 class="sh">Handy weights</h2><div class="card">${[["1 tbsp butter","≈ 14 g"],["1 tbsp honey","≈ 21 g"],["1 tbsp olive oil","≈ 13 g"],["1 tbsp water","15 g"],["1 tsp fine salt","≈ 6 g"]].map(([a,b])=>`<div class="ing"><div class="n">${a}</div><b>${b}</b></div>`).join("")}
   <div class="faint" style="margin-top:8px">Scaling: multiply by new flour ÷ old flour; trays by the area ratio.</div></div>
  <h2 class="sh">Troubleshooting</h2>${RIDS.map(r=>acc("t"+r,RECIPES[r].name,TROUBLE[r].map(([p,c,f])=>`<div class="trow"><b>${esc(p)}</b><div class="cause">${esc(c)}</div><div class="fix">${esc(f)}</div></div>`).join(""))).join("")}
  <h2 class="sh">App</h2><div class="card"><div class="ctrl" style="display:block"><div class="lab" style="margin-bottom:8px">Appearance</div>${seg("theme",[["auto","Auto"],["light","Light"],["dark","Dark"]],S.theme)}</div>
   <div class="faint" style="margin-top:10px">Everything is saved on this device only. Add to Home Screen for a full-screen app.</div><div class="spacer"></div><button class="btn ghost" data-act="resetall">Reset all settings</button></div></div>`;
}

/* ---------- render ---------- */
const VIEWS={recipes:()=>S.detail?vDetail(S.detail):vHome(),plan:vPlan,timer:vTimer,starter:vStarter,ref:vRef};
let lastKey="";
function render(anim){
  const v=$("#view"),key=S.tab+"|"+(S.tab==="recipes"?S.detail||"":""),keep=key===lastKey?v.scrollTop:0;
  v.className="view"+(S.tab==="timer"?(S.session?" timerv":" timerv tstart"):"")+(S.session&&S.tab!=="timer"&&!(S.tab==="recipes"&&!S.detail)?" has-pill":"");
  v.innerHTML=VIEWS[S.tab]();
  if(key!==lastKey){v.scrollTop=0;void v.offsetWidth;v.classList.add(anim||"enter")}else v.scrollTop=keep;
  lastKey=key;
  document.querySelectorAll(".tabbar button").forEach(b=>b.classList.toggle("on",b.dataset.arg===S.tab));
  $("#tbadge").style.display=S.session&&S.session.running?"block":"none";
  renderPill();onScroll();
  const sc=$("#scards");if(sc){const c=sc.querySelector(".cur");if(c)sc.scrollLeft=c.offsetLeft-sc.clientWidth/2+c.clientWidth/2}
  document.body.classList.toggle("ontimer",S.tab==="timer");document.documentElement.dataset.theme=S.theme==="auto"?"":S.theme;
  const dark=S.theme==="dark"||(S.theme==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  $('meta[name="theme-color"]').content=S.tab==="timer"?"#2B1D15":dark?"#1A1410":"#FBF6EE";
  save();
}
function renderPill(){const p=$("#pill"),s=S.session;if(!s||S.tab==="timer"||(S.tab==="recipes"&&!S.detail)){p.style.display="none";return}
  const st=s.steps[s.idx],rem=remNow(),fr=st.d?1-rem/(st.d*60):1,C=2*Math.PI*16;
  p.style.display="flex";p.innerHTML=`<svg class="mini" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="4"/><circle data-live="pring" cx="20" cy="20" r="16" fill="none" stroke="#D9733F" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-fr)}" transform="rotate(-90 20 20)"/></svg><div class="tt"><b>${esc(st.t)}</b><span>${RECIPES[s.rid].short} · step ${s.idx+1}/${s.steps.length}${s.running?"":rem<=0?" · done":" · paused"}</span></div><div class="cd" data-live="pcd">${fmtCD(rem)}</div>`}
let lastState="";
function updateTimerDom(){
  const s=S.session;if(!s)return;const rem=remNow(),st=s.steps[s.idx];
  const sig=`${s.idx}|${s.running}|${rem<=0}`;
  if(S.tab==="timer"){if(sig!==lastState){lastState=sig;render();return}
    const C=2*Math.PI*130,fr=st.d?1-rem/(st.d*60):1;const r=$("#ringfg");if(r)r.setAttribute("stroke-dashoffset",(C*(1-fr)).toFixed(1));
    document.querySelectorAll('[data-live="cd"]').forEach(e=>e.textContent=fmtCD(rem));
    const totalAll=s.steps.reduce((a,x)=>a+x.d,0),doneMin=s.steps.slice(0,s.idx).reduce((a,x)=>a+x.d,0)+(st.d-rem/60);
    const ob=$('[data-live="obar"]');if(ob)ob.style.width=(doneMin/totalAll*100).toFixed(1)+"%";const ol=$('[data-live="oleft"]');if(ol)ol.textContent=`≈ ${fmtDur(totalAll-doneMin)} to go`;
  }else{if(sig!==lastState){lastState=sig;renderPill();$("#tbadge").style.display=s.running?"block":"none"}
    const C=2*Math.PI*16,fr=st.d?1-rem/(st.d*60):1;const pr=$('[data-live="pring"]');if(pr)pr.setAttribute("stroke-dashoffset",C*(1-fr));
    document.querySelectorAll('[data-live="pcd"],[data-live="cd"]').forEach(e=>e.textContent=fmtCD(rem));}
}
function onScroll(){const v=$("#view"),n=v.querySelector(".nav");if(n)n.classList.toggle("solid",v.scrollTop>(S.tab==="recipes"&&S.detail?170:36))}

/* ---------- sheet ---------- */
function sheet(html){const bg=document.createElement("div");bg.className="sheet-bg";const sh=document.createElement("div");sh.className="sheet";sh.innerHTML=`<div class="grab"></div>${html}`;bg.onclick=closeSheet;document.body.append(bg,sh)}
function closeSheet(){document.querySelectorAll(".sheet,.sheet-bg").forEach(e=>e.remove())}

/* ---------- actions ---------- */
const ACT={
  tab(a){haptic();if(a===S.tab&&a==="recipes"&&S.detail){S.detail=null;render("pop");return}S.tab=a;render("enter")},
  open(a){haptic();S.detail=a;S.seg="ing";S.rid=a;render("push")},
  back(){haptic();S.detail=null;render("pop")},
  seg(a){S.seg=a;render()},
  temp(d){S.temp=clamp(S.temp+ +d,16,40);haptic(5);render()},
  loafmode(a){S.scale.loaf.mode=a;render()},
  loafn(d){S.scale.loaf.n=clamp(S.scale.loaf.n+ +d,1,8);haptic(5);render()},
  loafw(d){S.scale.loaf.w=clamp(S.scale.loaf.w+50*d,300,12000);haptic(5);render()},
  tray(a){S.scale.focaccia.tray=a;haptic(5);render()},
  trayw(d){S.scale.focaccia.cw=clamp(S.scale.focaccia.cw+ +d,10,80);render()},
  trayl(d){S.scale.focaccia.cl=clamp(S.scale.focaccia.cl+ +d,10,80);render()},
  balls(d){S.scale.pizza.balls=clamp(S.scale.pizza.balls+ +d,1,24);haptic(5);render()},
  bw(d){S.scale.pizza.bw=clamp(S.scale.pizza.bw+5*d,150,400);haptic(5);render()},
  tin(a){S.scale.sandwich.tin=a;render()},
  tinn(d){S.scale.sandwich.n=clamp(S.scale.sandwich.n+ +d,1,6);render()},
  hreset(){const r=S.detail;S.hyd[r]=LEAN[r].H0;render()},
  planthis(a){haptic();S.rid=a;S.tab="plan";S.detail=null;render("enter")},
  startthis(a){haptic();S.rid=a;if(S.session){sheet(`<h3>Replace the current bake?</h3><p class="muted">${RECIPES[S.session.rid].name} is on step ${S.session.idx+1}. Starting ${RECIPES[a].name} ends it.</p><div class="btnrow"><button class="btn sec" data-act="sheetclose">Keep it</button><button class="btn" data-act="replace" data-arg="${a}">Start new</button></div>`);return}S.tab="timer";S.detail=null;render("enter")},
  replace(a){closeSheet();S.session=null;S.rid=a;S.tab="timer";render("enter")},
  sheetclose(){closeSheet()},
  prid(a){S.rid=a;render()},trid(a){S.rid=a;render()},
  pmode(a){S.plan.mode=a;render()},
  pdate(a){S.plan.date=a;haptic(5);render()},
  ptime(d){const k=S.plan.mode==="finish";const cur=parseClock(k?S.plan.anchor[S.rid]:S.plan.start)??540;const nv=fmtClock(cur+ +d);if(k)S.plan.anchor[S.rid]=nv;else S.plan.start=nv;haptic(5);render()},
  pcold(a){S.cold[S.rid]=+a;render()},
  tstart(a){startSession(S.rid,+a);render()},
  tplay(){unlockAudio();haptic(12);if(S.session.running)tPause();else tPlay();render()},
  tnext(){unlockAudio();haptic(12);const s=S.session;if(s.idx<s.steps.length-1)tGo(s.idx+1,true);render()},
  tprev(){haptic();tGo(S.session.idx-1,false);render()},
  tgo(a){haptic();tGo(+a,false);render()},
  treset(){tGo(S.session.idx,false);render()},
  tadd(d){tAdd(+d);render()},
  tsound(){S.sound=!S.sound;if(S.sound){unlockAudio();chime()}render()},
  twake(){S.wake=!S.wake;wakeSync();render()},
  tend(){sheet(`<h3>End this bake?</h3><p class="muted">The timer and step progress will be cleared.</p><div class="btnrow"><button class="btn sec" data-act="sheetclose">Keep going</button><button class="btn" data-act="tendok">End bake</button></div>`)},
  tendok(){closeSheet();S.session=null;wakeSync();document.body.classList.remove("focus");render()},
  focus(){const b=document.body;b.classList.toggle("focus");try{if(b.classList.contains("focus"))document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});else document.fullscreenElement&&document.exitFullscreen()}catch(e){}render()},
  fed(){S.starter.fedAt=Date.now();haptic(20);toast("Feed logged. Fridge it after 1–2 h (30–60 min if 28 °C+).");render()},
  week(a){S.weekHot=a==="1";render()},
  acc(a){S.openAcc[a]=!S.openAcc[a];render()},
  theme(a){S.theme=a;render()},
  resetall(){sheet(`<h3>Reset everything?</h3><p class="muted">Scaling, plans, starter log and any running bake will be cleared.</p><div class="btnrow"><button class="btn sec" data-act="sheetclose">Cancel</button><button class="btn" data-act="resetok">Reset</button></div>`)},
  resetok(){closeSheet();localStorage.removeItem(KEY);S=JSON.parse(JSON.stringify(DEFAULT));render()}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset.arg)}});
document.addEventListener("input",e=>{
  if(e.target.id==="hyd"){const r=S.detail,L=LEAN[r],v=+e.target.value;S.hyd[r]=v;e.target.style.setProperty("--p",((v-L.Hmin)/(L.Hmax-L.Hmin)*100)+"%");$("#hval").innerHTML=`${v.toFixed(1)}<small>%</small>`;$("#ingbox").innerHTML=ingBox(r,calc(r));save()}
});
document.addEventListener("change",e=>{
  if(e.target.id==="hyd")render();
  if(e.target.id==="ptime"){const v=e.target.value;if(parseClock(v)!==null){if(S.plan.mode==="finish")S.plan.anchor[S.rid]=v;else S.plan.start=v;render()}}
});
document.addEventListener("keydown",e=>{if(S.tab==="timer"&&S.session&&e.code==="Space"&&e.target===document.body){e.preventDefault();ACT.tplay()}});
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&document.body.classList.contains("focus")){document.body.classList.remove("focus");render()}});
window.addEventListener("storage",e=>{if(e.key===KEY&&e.newValue){try{S=merge(JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(e.newValue));render()}catch(x){}}});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>render());

/* ---------- boot ---------- */
function boot(){
  $("#view").addEventListener("scroll",onScroll,{passive:true});
  // manifest (single-file: generated at runtime so start_url matches wherever the file lives)
  try{const icon=document.querySelector('link[rel="apple-touch-icon"]').href;
    const m={name:"Michael's Baking",short_name:"Baking",start_url:location.href.split("#")[0],scope:location.href.split("#")[0].replace(/[^/]*$/,""),display:"standalone",orientation:"portrait",background_color:"#FBF6EE",theme_color:"#B5562F",
      icons:[{src:ICON512,sizes:"512x512",type:"image/png",purpose:"any"},{src:ICON192,sizes:"192x192",type:"image/png"},{src:icon,sizes:"180x180",type:"image/png"}]};
    const l=document.createElement("link");l.rel="manifest";l.href="data:application/manifest+json;charset=utf-8,"+encodeURIComponent(JSON.stringify(m));document.head.appendChild(l)}catch(e){}
  if(S.session&&S.session.running&&remNow()<=0&&!S.session.alerted){S.session.running=false;S.session.remaining=0;S.session.alerted=true;saveNow()}
  render("enter");
}
boot();

</script>
</body>
</html>
