name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Pick a browser
        run: |
          if [ -x /usr/bin/google-chrome ]; then echo "CHROME=/usr/bin/google-chrome" >> "$GITHUB_ENV";
          else echo "CHROME=$(python -c 'from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"; fi
      - name: Run all suites
        run: |
          "$CHROME" --version
          sh test/run_all.sh 2>&1 | tee test-log.txt
          exit ${PIPESTATUS[0]:-0}
        shell: bash
      - name: Upload log and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            test-log.txt
            shots/
